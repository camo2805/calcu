<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calcu">
<meta name="theme-color" content="#26313B">
<title>Calcu — calculadora científica</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D3D9DE; --ink:#1F2933; --muted:#5B6773; --line:rgba(31,41,51,.14);
  --lcd:#CBD5C5; --lcd-ink:#1C2520; --lcd-muted:#4F5C53; --lcd-dot:rgba(28,37,32,.07); --lcd-edge:#A9B5A3;
  --key:#F4F6F7; --key-num:#FFFFFF; --key-ink:#1F2933; --key-shadow:#AEB7BF;
  --op:#3A6A8C; --op-ink:#FFFFFF; --fn:#C5CDD4;
  --shift:#B87A08; --shift-bg:#E3A21A; --danger:#A8433C; --exe:#2E7A67;
  --chip:#C3CBD2; --sheet:#EDF0F2; --err:#9C2F28;
  --g1:#2F6FA3; --g2:#B5452F; --g3:#3E8E5A; --g4:#8A5AAE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  height:100%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="slate"]){
    --bg:#232D36; --ink:#E9EDF1; --muted:#9AA6B2; --line:rgba(255,255,255,.1);
    --lcd:#BCC7B6; --lcd-ink:#161F19; --lcd-muted:#46534A; --lcd-dot:rgba(22,31,25,.08); --lcd-edge:#0F161C;
    --key:#36424E; --key-num:#46535F; --key-ink:#EEF1F4; --key-shadow:#161D24;
    --op:#2F5D7C; --op-ink:#FFFFFF; --fn:#2C3742;
    --shift:#F0B233; --shift-bg:#E3A21A; --danger:#9A3F39; --exe:#2B7362;
    --chip:#33404C; --sheet:#2B3641; --err:#FFB4A8;
    --g1:#1F5E94; --g2:#A63A25; --g3:#2F7A4A; --g4:#7A4B9E;
  }
}
:root[data-theme="dark"]{
  --bg:#232D36; --ink:#E9EDF1; --muted:#9AA6B2; --line:rgba(255,255,255,.1);
  --lcd:#BCC7B6; --lcd-ink:#161F19; --lcd-muted:#46534A; --lcd-dot:rgba(22,31,25,.08); --lcd-edge:#0F161C;
  --key:#36424E; --key-num:#46535F; --key-ink:#EEF1F4; --key-shadow:#161D24;
  --op:#2F5D7C; --op-ink:#FFFFFF; --fn:#2C3742;
  --shift:#F0B233; --shift-bg:#E3A21A; --danger:#9A3F39; --exe:#2B7362;
  --chip:#33404C; --sheet:#2B3641; --err:#FFB4A8;
  --g1:#1F5E94; --g2:#A63A25; --g3:#2F7A4A; --g4:#7A4B9E;
}
:root[data-theme="slate"]{
  --bg:#263650; --ink:#EDF1F6; --muted:#A3B1C6; --line:rgba(255,255,255,.12);
  --lcd:#DCE2E5; --lcd-ink:#1A2330; --lcd-muted:#4E5B6B; --lcd-dot:rgba(26,35,48,.06); --lcd-edge:#141E2E;
  --key:#3B4E6D; --key-num:#4A5E80; --key-ink:#F1F4F8; --key-shadow:#16213A;
  --op:#5877A8; --op-ink:#FFFFFF; --fn:#32445F;
  --shift:#F2B640; --shift-bg:#E3A21A; --danger:#A5463F; --exe:#2F7F6C;
  --chip:#34476A; --sheet:#2E4060; --err:#FFB4A8;
  --g1:#2B64A0; --g2:#B04428; --g3:#2F8050; --g4:#7F4FA6;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--shift-bg);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:6px 10px 8px}

/* Header */
header{display:flex;align-items:center;gap:6px;padding:4px 0 8px}
.tabs{display:flex;flex:1;background:var(--chip);border-radius:10px;padding:3px}
.tabs button{flex:1;padding:7px 0;border-radius:8px;font-weight:600;font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--key-num);color:var(--ink);box-shadow:0 1px 0 var(--key-shadow)}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--chip)}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8}

/* LCD */
#screen{flex:1;min-height:0;display:flex;flex-direction:column}
.lcd{
  flex:1;min-height:0;display:flex;flex-direction:column;
  background-color:var(--lcd);color:var(--lcd-ink);
  background-image:radial-gradient(var(--lcd-dot) 1px, transparent 1.2px);
  background-size:4px 4px;
  border-radius:12px;border:2px solid var(--lcd-edge);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.18);
  overflow:hidden;
}
#status{display:flex;gap:6px;padding:6px 10px 2px;font-size:12px;font-weight:600;color:var(--lcd-muted)}
#status span{padding:1px 6px;border:1px solid currentColor;border-radius:4px;line-height:1.3}
#status .on{background:var(--lcd-ink);color:var(--lcd);border-color:var(--lcd-ink)}
#status .shiftflag{display:none}
body.shift #status .shiftflag{display:inline;background:var(--shift-bg);color:#1C1A12;border-color:var(--shift-bg)}
#hist{flex:1;min-height:0;overflow-y:auto;padding:4px 10px;display:flex;flex-direction:column;gap:2px;-webkit-overflow-scrolling:touch}
#hist .empty{margin:auto;text-align:center;color:var(--lcd-muted);font-size:14px;line-height:1.5;max-width:30ch}
.entry{border-bottom:1px solid rgba(0,0,0,.08);padding:4px 0 6px}
.entry .in{color:var(--lcd-muted);overflow-x:auto;font-size:13px;cursor:pointer;text-align:left;white-space:nowrap}
.entry .out{overflow-x:auto;text-align:right;cursor:pointer;font-size:20px;white-space:nowrap;padding:2px 0}
.entry .alt{text-align:right;color:var(--lcd-muted);font-size:14px;overflow-x:auto;white-space:nowrap}
.entry .err{text-align:right;color:var(--err);font-weight:600;font-size:14px}
:root[data-theme] .entry .err, .entry .err{color:#9C2F28}
.entry mjx-container{margin:2px 0!important}
.in mjx-container{text-align:left!important}
.out mjx-container,.alt mjx-container{text-align:right!important}
#edit{border-top:1px solid rgba(0,0,0,.12);padding:4px 10px 8px}
#preview{min-height:30px;overflow-x:auto;color:var(--lcd-ink);font-size:17px;white-space:nowrap;padding:2px 0}
#preview mjx-container{text-align:left!important;margin:2px 0!important}
#preview.bad{opacity:.45}
.inrow{display:flex;gap:6px;align-items:center}
#expr:focus{outline:none;border-color:var(--lcd-ink)}
#expr{
  flex:1;min-width:0;font:500 20px/1.2 "Barlow",system-ui,sans-serif;
  background:rgba(255,255,255,.35);color:var(--lcd-ink);border:1px solid rgba(0,0,0,.15);
  border-radius:6px;padding:6px 8px;-webkit-user-select:text;user-select:text;caret-color:var(--lcd-ink);
}
.smallbtn{font-size:13px;font-weight:600;padding:6px 9px;border-radius:6px;background:rgba(0,0,0,.08);color:var(--lcd-ink)}
.smallbtn[aria-pressed="true"]{background:var(--lcd-ink);color:var(--lcd)}

/* Graph */
#graph{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#graph[hidden]{display:none}
.funcs{display:grid;gap:4px}
.frow{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:8px;padding:3px 6px}
.frow .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--c);background:var(--c);flex:none}
.frow .dot[aria-pressed="false"]{background:transparent}
.frow .lab{font-weight:600;font-size:14px;width:44px;white-space:nowrap;text-align:left;color:var(--muted);border-radius:4px;padding:2px}
.frow.sel .lab{background:var(--ink);color:var(--bg)}
.frow input{flex:1;min-width:0;font:500 16px "Barlow",system-ui,sans-serif;background:var(--key-num);color:var(--key-ink);border:0;border-radius:6px;padding:6px 8px;-webkit-user-select:text;user-select:text}
.canvaswrap{flex:1;min-height:150px;position:relative;border-radius:12px;border:2px solid var(--lcd-edge);overflow:hidden;background:var(--lcd)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#readout{white-space:pre-wrap;min-height:22px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.35}
.gbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.gbar::-webkit-scrollbar{display:none}
.gbar button{flex:none;padding:7px 11px;border-radius:8px;background:var(--chip);font-weight:600;font-size:14px}
.gbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Chips */
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;padding:6px 11px;border-radius:14px;background:var(--chip);font-size:14px;font-weight:600;white-space:nowrap}
#chips:empty{display:none}

/* Keypad */
#pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#pad[hidden]{display:none}
.key{
  position:relative;height:clamp(40px,6.3vh,58px);border-radius:9px;
  background:var(--key);color:var(--key-ink);
  box-shadow:0 2px 0 var(--key-shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  transition:transform .05s;
}
.key:active,.key.down{transform:translateY(2px);box-shadow:0 0 0 var(--key-shadow)}
.key .m{font-size:19px;font-weight:600;line-height:1}
.key .s{font-size:11px;font-weight:600;color:var(--shift);line-height:1;min-height:11px}
.key sup{font-size:.65em}
.key.num{background:var(--key-num)}
.key.num .m{font-size:22px}
.key.op{background:var(--op);color:var(--op-ink)}
.key.op .s{color:#FFD27A}
.key.fnk{background:var(--fn)}
.key.shiftk{background:var(--shift-bg);color:#1C1A12}
.key.shiftk .m{font-size:15px}
.key.danger{background:var(--danger);color:#fff}
.key.danger .s{color:#FFD27A}
.key.exe{background:var(--exe);color:#fff}
.key.exe .s{color:#FFD27A}
body.shift .key .s{background:var(--shift-bg);color:#1C1A12;border-radius:3px;padding:0 3px}
body.shift .key.shiftk{outline:2px solid var(--ink)}

/* Sheet */
#sheetback{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;
  background:var(--sheet);color:var(--ink);border-radius:16px 16px 0 0;
  max-height:78%;display:flex;flex-direction:column;
  padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 24px rgba(0,0,0,.25);
}
#sheet[hidden],#sheetback[hidden]{display:none}
.sheethead{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px}
.sheethead h2{margin:0;font-size:18px;font-weight:600}
.sheetbody{overflow-y:auto;-webkit-overflow-scrolling:touch}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:6px 11px;border-radius:14px;background:var(--chip);font-weight:600;font-size:14px}
.cats button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.item{text-align:left;background:var(--key-num);color:var(--key-ink);border-radius:8px;padding:8px 10px;box-shadow:0 1px 0 var(--key-shadow)}
.item b{display:block;font-size:15px;font-weight:600}
.item small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
:root[data-theme="dark"] .item small,:root[data-theme="slate"] .item small{color:#B5C0CC}
.setrow{padding:10px 0;border-bottom:1px solid var(--line)}
.setrow > span{display:block;font-weight:600;margin-bottom:6px}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--key-num);color:var(--ink)}
.wide{width:100%;padding:10px;border-radius:9px;background:var(--chip);font-weight:600;margin-top:6px}
.about{font-size:13px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;font-weight:600;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.key{transition:none}}
@media (min-height:880px){#chips button{font-size:15px}}
</style>
</head>
<body>
<div id="loading" class="loading">Cargando motor matemático…</div>
<div id="app">
  <header>
    <div class="tabs" role="tablist">
      <button role="tab" data-mode="calc" aria-selected="true">Cálculo</button>
      <button role="tab" data-mode="cas" aria-selected="false">CAS</button>
      <button role="tab" data-mode="graph" aria-selected="false">Gráfica</button>
    </div>
    <button class="iconbtn" id="btnCat" aria-label="Catálogo de funciones">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <button class="iconbtn" id="btnSet" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
    </button>
  </header>

  <section id="screen">
    <div class="lcd" id="lcd">
      <div id="status">
        <span id="stAngle">DEG</span>
        <span id="stExact">Exacto</span>
        <span class="shiftflag">SHIFT</span>
      </div>
      <div id="hist" aria-live="polite"></div>
      <div id="edit">
        <div id="preview"></div>
        <div class="inrow">
          <input id="expr" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Expresión">
          <button class="smallbtn" id="btnKbd" aria-pressed="false" aria-label="Usar teclado del teléfono">abc</button>
        </div>
      </div>
    </div>

    <div id="graph" hidden>
      <div class="funcs" id="funcs"></div>
      <div class="canvaswrap"><canvas id="cv" aria-label="Área de gráfica"></canvas></div>
      <div id="readout">Arrastra para mover, pellizca para acercar. Toca dos veces para volver a la vista estándar.</div>
      <div class="gbar">
        <button id="gTrace" aria-pressed="false">Trazar</button>
        <button id="gRoots">Raíces</button>
        <button id="gExt">Máx/Mín</button>
        <button id="gInt">Intersección</button>
        <button id="gFit">Ajustar Y</button>
        <button id="gStd">Estándar</button>
        <button id="gPad" aria-pressed="false">Teclas</button>
      </div>
    </div>
  </section>

  <div id="chips"></div>
  <div id="pad"></div>
</div>

<div id="sheetback" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheethead"><h2 id="sheetTitle"></h2><button class="iconbtn" id="sheetClose" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheetbody" id="sheetBody"></div>
</div>

<script>
window.__mjReady = new Promise(function(res){
  window.MathJax = {
    tex:{packages:{'[+]':[]}},
    svg:{fontCache:'local'},
    startup:{typeset:false, ready:function(){ MathJax.startup.defaultReady(); MathJax.startup.promise.then(function(){ try{ document.head.appendChild(MathJax.svgStylesheet()); }catch(e){} res(); }); }}
  };
});
</script>
<script src="lib/math.js"></script>
<script src="lib/nerdamer.all.min.js"></script>
<script src="lib/tex-svg-full.js" async></script>
<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };

/* ---------- Estado ---------- */
var KEY = 'calcu.v1';
var DEF = { mode:'calc', angle:'DEG', exact:true, comma:true, digits:12, theme:'auto',
  history:[], vars:{}, casDefs:[], ans:0,
  funcs:[{e:'sin(x)',on:true},{e:'x^2/10-2',on:true},{e:'',on:true},{e:'',on:true}], gsel:0, view:null };
var S = (function(){
  try{ var raw = localStorage.getItem(KEY); if(raw){ var o = JSON.parse(raw); return Object.assign({}, DEF, o); } }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
})();
var ansVal = S.ans;
var userScope = Object.assign({}, S.vars);
function save(){
  try{
    var vars = {};
    Object.keys(userScope).forEach(function(k){ if(typeof userScope[k]==='number' && isFinite(userScope[k])) vars[k]=userScope[k]; });
    var o = Object.assign({}, S, { vars:vars, history:S.history.slice(-60), ans:(typeof ansVal==='number'?ansVal:0) });
    localStorage.setItem(KEY, JSON.stringify(o));
  }catch(e){}
}

/* ---------- Motor ---------- */
var BBL = '158.987294928 liter';
try{ math.createUnit('bbl', BBL, {override:true}); }catch(e){}
[['MBD','1000 bbl/day'],['MMBD','1e6 bbl/day'],['Mbbl','1000 bbl'],['MMbbl','1e6 bbl'],['MMBTU','1e6 BTU'],['TM','1 tonne']].forEach(function(u){
  try{ math.createUnit(u[0], u[1]); }catch(e){}
});

var BUILTIN = {};
function erf(x){ return math.erf(x); }
function makeScope(forceRad){
  var sc = Object.assign({}, userScope);
  var extra = {
    Ans: ansVal,
    ln: function(x){ return math.log(x); },
    nCr: function(a,b){ return math.combinations(a,b); },
    nPr: function(a,b){ return math.permutations(a,b); },
    normpdf: function(x,m,s){ m=m||0; s=s||1; return Math.exp(-0.5*Math.pow((x-m)/s,2))/(s*Math.sqrt(2*Math.PI)); },
    normcdf: function(x,m,s){ m=m||0; s=s||1; return 0.5*(1+erf((x-m)/(s*Math.SQRT2))); }
  };
  if(S.angle==='DEG' && !forceRad){
    var k = Math.PI/180;
    var isU = function(x){ return x && typeof x==='object' && x.type==='Unit'; };
    ['sin','cos','tan','sec','csc','cot'].forEach(function(f){
      extra[f] = function(x){ return isU(x) ? math[f](x) : math[f](math.multiply(x,k)); };
    });
    ['asin','acos','atan','asec','acsc','acot'].forEach(function(f){
      extra[f] = function(x){ return math.divide(math[f](x), k); };
    });
    extra.atan2 = function(y,x){ return Math.atan2(y,x)/k; };
  }
  Object.keys(extra).forEach(function(n){ BUILTIN[n]=true; sc[n]=extra[n]; });
  return sc;
}

function prep(s){
  return s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi').replace(/√\(/g,'sqrt(');
}

/* ---------- Formato numérico ---------- */
function trimZeros(s){ if(s.indexOf('.')<0) return s; s=s.replace(/0+$/,''); return s.replace(/\.$/,''); }
function group(s){
  var neg = s.charAt(0)==='-'; if(neg) s=s.slice(1);
  var p = s.split('.'), i=p[0], f=p[1];
  var sep = S.comma ? '.' : '\u2009';
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
  return (neg?'-':'') + i + (f ? (S.comma?',':'.') + f : '');
}
function numParts(x, digits){
  digits = digits || S.digits;
  if(!isFinite(x)) return { m: isNaN(x)?'NaN':(x>0?'inf':'-inf'), e:null };
  if(x===0) return {m:'0', e:null};
  var ax = Math.abs(x);
  if(ax>=1e12 || ax<1e-6){
    var p = x.toExponential(digits-1).split('e');
    return { m: group(trimZeros(p[0])), e: parseInt(p[1],10) };
  }
  return { m: group(trimZeros(x.toPrecision(digits))), e:null };
}
function fmtNum(x, digits){
  var p = numParts(x, digits);
  if(p.m==='NaN') return 'indefinido';
  if(p.m==='inf') return '∞'; if(p.m==='-inf') return '−∞';
  var m = p.m.replace('-','−');
  return p.e===null ? m : m + '×10^' + p.e;
}
function texNum(x){
  var p = numParts(x);
  if(p.m==='NaN') return '\\text{indefinido}';
  if(p.m==='inf') return '\\infty'; if(p.m==='-inf') return '-\\infty';
  var m = p.m.replace(/,/g,'{,}').replace(/\u2009/g,'\\,');
  return p.e===null ? m : m + '\\times 10^{' + p.e + '}';
}
function machine(x){ return trimZeros(Number(x).toPrecision(15)).replace(/e\+?/, 'e'); }
function esc(s){ return String(s).replace(/[\\{}$&#^_%~]/g, function(c){ return '\\'+c; }); }
function texText(s){ return '\\text{' + esc(s) + '}'; }

/* ---------- TeX ---------- */
var FN_TEX = {sin:'\\sin',cos:'\\cos',tan:'\\tan',sec:'\\sec',csc:'\\csc',cot:'\\cot',
  asin:'\\arcsin',acos:'\\arccos',atan:'\\arctan',sinh:'\\sinh',cosh:'\\cosh',tanh:'\\tanh',
  ln:'\\ln',log:'\\ln',exp:'\\exp',arcsin:'\\arcsin',arccos:'\\arccos',arctan:'\\arctan',abs:'\\operatorname{abs}'};
function cleanTeX(t){
  return t.replace(/\\mathrm\{([a-z]+)\}/g, function(m,f){ return FN_TEX[f] || '\\operatorname{'+f+'}'; })
          .replace(/\\cdot\s*(?=\\?[a-zA-Z(])/g, '\\,');
}
function mathjsTeX(expr){
  var e = prep(expr);
  var m = e.match(/^([^=<>!]+)=([^=].*)$/);
  try{
    if(e.indexOf(':=')<0 && m && S.mode==='cas'){
      return cleanTeX(math.parse(m[1]).toTex({parenthesis:'keep',implicit:'hide'})) + '=' + cleanTeX(math.parse(m[2]).toTex({parenthesis:'keep',implicit:'hide'}));
    }
    if(e.indexOf(':=')>=0){
      var p = e.split(':=');
      return cleanTeX(math.parse(p[0]).toTex()) + ':=' + cleanTeX(math.parse(p[1]).toTex({parenthesis:'keep',implicit:'hide'}));
    }
    return cleanTeX(math.parse(e).toTex({parenthesis:'keep',implicit:'hide'}));
  }catch(err){ return null; }
}
function nTeX(r){ return cleanTeX(r.toTeX()); }

var mjq = Promise.resolve();
function renderTeX(el, tex, display){
  mjq = mjq.then(function(){ return window.__mjReady; }).then(function(){
    el.innerHTML='';
    return MathJax.tex2svgPromise('\\displaystyle '+tex, {display:false}).then(function(node){ el.appendChild(node); });
  }).catch(function(){ el.textContent = tex; });
  return mjq;
}

/* ---------- Resultado mathjs a salida ---------- */
function matTeX(arr){
  var rows = Array.isArray(arr[0]) ? arr : [arr];
  return '\\begin{bmatrix}' + rows.map(function(r){ return r.map(cellTeX).join('&'); }).join('\\\\') + '\\end{bmatrix}';
}
function cellTeX(v){
  if(typeof v==='number') return texNum(v);
  if(math.isComplex(v)) return complexTeX(v);
  if(math.isFraction && math.isFraction(v)) return '\\frac{'+v.n*v.s+'}{'+v.d+'}';
  return texText(String(v));
}
function complexTeX(c){
  var re=c.re, im=c.im;
  if(Math.abs(im) < 1e-14*Math.max(1,Math.abs(re))) return texNum(re);
  var imS = Math.abs(im)===1 ? '' : texNum(Math.abs(im));
  if(Math.abs(re) < 1e-14*Math.max(1,Math.abs(im))) return (im<0?'-':'') + imS + 'i';
  return texNum(re) + (im<0?'-':'+') + imS + 'i';
}
function valueOut(v){
  if(v && v.entries && Array.isArray(v.entries)) v = v.entries[v.entries.length-1];
  if(typeof v==='number') return { tex:texNum(v), ins:machine(v), num:v };
  if(typeof v==='boolean') return { tex:texText(v?'verdadero':'falso'), ins:String(v) };
  if(typeof v==='string') return { tex:texText(v), ins:JSON.stringify(v) };
  if(typeof v==='function') return { tex:texText('Función definida'), ins:'' };
  if(v===undefined || v===null) return { tex:texText('Hecho'), ins:'' };
  if(math.isComplex(v)) return { tex:complexTeX(v), ins:math.format(v,{precision:14}), val:v };
  if(math.isBigNumber && math.isBigNumber(v)) return valueOut(v.toNumber());
  if(math.isFraction && math.isFraction(v)) return { tex:cellTeX(v), ins:math.format(v) };
  if(math.isMatrix(v) || Array.isArray(v)){
    var arr = v.valueOf();
    return { tex: arr.length ? matTeX(arr) : '\\left[\\;\\right]', ins: math.format(v,{precision:14}), val:v };
  }
  if(math.isUnit(v)){
    try{
      var u = v.formatUnits();
      var num = v.toNumber(u);
      var ut = u ? cleanTeX(math.parse(u.replace(/\s+/g,' ')).toTex()).replace(/\\mathrm\{([^}]*)\}/g,'$1') : '';
      ut = ut.replace(/([a-zA-Z]+)/g, function(w){ return w.length>1 && !/^(frac|cdot|left|right|mathrm|operatorname|text)$/.test(w) ? '\\mathrm{'+w+'}' : w; });
      return { tex: texNum(num) + '\\;' + ut, ins: machine(num)+' '+u, val:v };
    }catch(e){ return { tex:texText(math.format(v,{precision:S.digits})), ins:math.format(v,{precision:14}), val:v }; }
  }
  return { tex:texText(String(v)), ins:String(v) };
}

/* ---------- Evaluación: Cálculo ---------- */
var TRIG = /\b(a?(sin|cos|tan|sec|csc|cot)h?)\(/;
function tryExact(expr){
  if(/[\[\]=<>]|\bto\b|\bin\b|\bdeg\b|°|nthRoot|cbrt|nCr|nPr|norm|mod\b|random|hex|bin|oct|[A-Z]{2,}(?!ns)/.test(expr)) return null;
  if(S.angle==='DEG' && TRIG.test(expr)) return null;
  try{
    var subs = {};
    Object.keys(userScope).forEach(function(k){ if(typeof userScope[k]==='number') subs[k]=machine(userScope[k]); });
    if(typeof ansVal==='number') subs.Ans = machine(ansVal);
    var e = expr.replace(/\bln\(/g,'log(');
    var r = nerdamer(e, subs);
    if(r.variables().length) return null;
    var tex = nTeX(r);
    if(/\d{7,}/.test(tex) || tex.length>90) return null;
    return tex;
  }catch(err){ return null; }
}
function evalCalc(expr, forceDec){
  var e = prep(expr);
  var sc = makeScope(false);
  var v = math.evaluate(e, sc);
  Object.keys(sc).forEach(function(k){ if(!BUILTIN[k] && k!=='Ans') userScope[k]=sc[k]; });
  var out = valueOut(v);
  var entry = { inTex: mathjsTeX(expr) || texText(expr), outTex: out.tex, ins: out.ins };
  if(out.num!==undefined){ ansVal = out.num; }
  else if(out.val!==undefined){ ansVal = out.val; }
  if(!forceDec && typeof out.num==='number' && isFinite(out.num) && !Number.isInteger(out.num)){
    var ex = tryExact(e);
    if(ex && ex.replace(/[{},\\ ]/g,'') !== out.tex.replace(/[{},\\ ]/g,'') && !/^-?\d+$/.test(ex)){
      entry.exTex = ex;
      entry.showEx = S.exact;
    }
  }
  return entry;
}

/* ---------- Evaluación: CAS ---------- */
function casPrep(s){ return prep(s).replace(/\bln\(/g,'log(').replace(/\*\*/g,'^'); }
function approxOf(r){
  try{
    if(r.variables && r.variables().length) return null;
    var d = Number(r.evaluate().text('decimals'));
    return isFinite(d) ? d : null;
  }catch(e){ return null; }
}
function replayCas(){
  S.casDefs.forEach(function(d){
    try{ if(d.t==='f') nerdamer.setFunction(d.n, d.a, d.b); else nerdamer.setVar(d.n, d.b); }catch(e){}
  });
}
function evalCAS(expr){
  var e = casPrep(expr).trim();
  var inTex = mathjsTeX(expr) || texText(expr);
  if(e.indexOf(':=')>0){
    var parts = e.split(':='), lhs = parts[0].trim(), rhs = parts[1].trim();
    var fm = lhs.match(/^([a-zA-Z]\w*)\s*\(([^)]*)\)$/);
    if(fm){
      var args = fm[2].split(',').map(function(s){ return s.trim(); });
      nerdamer.setFunction(fm[1], args, rhs);
      S.casDefs = S.casDefs.filter(function(d){ return d.n!==fm[1]; }).concat([{t:'f',n:fm[1],a:args,b:rhs}]);
      return { inTex:inTex, outTex: fm[1]+'('+args.join(',')+')='+nTeX(nerdamer(rhs)), ins:fm[1]+'(' };
    }
    nerdamer.setVar(lhs, rhs);
    S.casDefs = S.casDefs.filter(function(d){ return d.n!==lhs; }).concat([{t:'v',n:lhs,b:rhs}]);
    return { inTex:inTex, outTex: lhs+'='+nTeX(nerdamer(rhs)), ins:lhs };
  }
  var eqs = e.split(/[;\n]/).map(function(s){ return s.trim(); }).filter(Boolean);
  var isEq = eqs.length && eqs.every(function(q){ return /^[^=]+=[^=]+$/.test(q); });
  if(isEq){
    if(eqs.length>1){
      var sol = nerdamer.solveEquations(eqs.slice());
      if(!sol || !sol.length) return { inTex:inTex, outTex:texText('No se encontró solución'), ins:'' };
      return { inTex: '\\begin{cases}'+eqs.map(function(q){ return mathjsTeX(q)||texText(q); }).join('\\\\')+'\\end{cases}',
        outTex: sol.map(function(p){ return p[0]+'='+nTeX(nerdamer(String(p[1]))); }).join(',\\quad '),
        ins: sol.map(function(p){ return machine(Number(nerdamer(String(p[1])).evaluate().text('decimals'))); }).join(',') };
    }
    var q = eqs[0], sides = q.split('=');
    var vars = nerdamer('('+sides[0]+')-('+sides[1]+')').variables();
    if(!vars.length) throw new Error('La ecuación no tiene incógnitas');
    var v = vars.indexOf('x')>=0 ? 'x' : vars[0];
    var sols = nerdamer.solveEquations(q, v) || [];
    if(!sols.length) return { inTex:inTex, outTex:texText('No se encontró solución'), ins:'' };
    var rs = sols.map(function(s){ return nerdamer(String(s)); });
    var outTex = rs.map(function(r){ return v+'='+nTeX(r); }).join(',\\quad ');
    var ap = rs.map(approxOf);
    var entry = { inTex:inTex, outTex:outTex, ins: String(rs[0]) };
    var exactSimple = rs.every(function(r){ return /^-?\d+$/.test(r.text()); });
    if(!exactSimple && ap.every(function(a){ return a!==null; })){
      entry.altTex = ap.map(function(a){ return v+'\\approx '+texNum(a); }).join(',\\quad ');
    }
    return entry;
  }
  var r = nerdamer(e);
  var ent = { inTex:inTex, outTex:nTeX(r), ins:r.text() };
  var a = approxOf(r);
  if(a!==null && !/^-?\d+$/.test(r.text())) ent.altTex = '\\approx '+texNum(a);
  if(a!==null) ansVal = a;
  return ent;
}

/* ---------- Errores ---------- */
function friendly(err){
  var m = String(err && err.message || err);
  var rules = [
    [/Undefined symbol (\w+)/, function(x){ return 'Símbolo no definido: '+x[1]; }],
    [/Undefined function (\w+)/, function(x){ return 'Función no definida: '+x[1]; }],
    [/Unexpected end of expression/, function(){ return 'Expresión incompleta'; }],
    [/Parenthesis \) expected/, function(){ return 'Falta cerrar un paréntesis'; }],
    [/Unexpected operator/, function(){ return 'Operador fuera de lugar'; }],
    [/Value expected/, function(){ return 'Falta un valor'; }],
    [/Dimension mismatch|Dimensions mismatch/, function(){ return 'Las dimensiones no coinciden'; }],
    [/Units do not match/, function(){ return 'Las unidades no son compatibles'; }],
    [/Unit .* not found/, function(){ return 'Unidad no reconocida'; }],
    [/Division by zero/i, function(){ return 'División entre cero'; }],
    [/Too many arguments|Too few arguments/, function(){ return 'Número de argumentos incorrecto'; }],
    [/not a valid variable name/, function(){ return 'Nombre de variable no válido'; }],
    [/Matrix must be square|singular/i, function(){ return 'La matriz no es invertible o no es cuadrada'; }]
  ];
  for(var i=0;i<rules.length;i++){ var mm = m.match(rules[i][0]); if(mm) return rules[i][1](mm); }
  return 'Error: ' + m;
}

  }else{

function renderHistory(){
  hist.innerHTML='';

  if(!list.length){
    var em = document.createElement('div'); em.className='empty';
    em.textContent = S.mode==='cas'
      ? 'Escribe una expresión con x o usa los atajos: derivar, integrar, resolver, factorizar.'

  }

}

  S.history.push(en);

function insertText(txt){
  if(S.mode==='graph' && activeInput===expr){ var gi=document.querySelectorAll('.frow input')[S.gsel]; if(gi) activeInput=gi; }
  var el = activeInput;
  var a = el.selectionStart!=null ? el.selectionStart : el.value.length;
  var b = el.selectionEnd!=null ? el.selectionEnd : a;
  var cur = txt.indexOf('§');
  var clean = txt.replace('§','');
  el.value = el.value.slice(0,a) + clean + el.value.slice(b);
  var pos = a + (cur>=0 ? cur : clean.length);

  if(document.activeElement!==el && !isTouch) el.focus({preventScroll:true});
  onInputChange();
}

function smartDelete(){
  var el = activeInput;
  var a = el.selectionStart!=null ? el.selectionStart : el.value.length, b = el.selectionEnd!=null ? el.selectionEnd : a;
  if(a!==b){ el.value = el.value.slice(0,a)+el.value.slice(b); el.setSelectionRange(a,a); onInputChange(); return; }
  if(a===0) return;
  var before = el.value.slice(0,a);
  var m = before.match(/(?:[a-zA-Z][a-zA-Z0-9]*\(|Ans|pi| to | mod |\*10\^\()$/);
  var n = m ? m[0].length : 1;
  el.value = el.value.slice(0,a-n) + el.value.slice(a);
  el.setSelectionRange(a-n,a-n);
  onInputChange();
}
function moveCaret(d){
  var el = activeInput;
  if(d<0 && !el.value && activeInput===expr){
    var l = S.history.filter(function(h){ return h.mode===S.mode; });
    if(l.length){ el.value = l[l.length-1].input; el.setSelectionRange(el.value.length, el.value.length); onInputChange(); }
    return;
  }
  var p = (el.selectionStart!=null ? el.selectionStart : el.value.length) + d;
  if(d===-999) p=0; if(d===999) p=el.value.length;
  p = Math.max(0, Math.min(el.value.length, p));
  el.setSelectionRange(p,p);
}

/* ---------- Acciones ---------- */
function exe(forceDec){
  if(S.mode==='graph'){ drawGraph(); if(document.activeElement) document.activeElement.blur(); return; }
  var src = expr.value.trim(); if(!src) return;
  var en;
  try{
    en = S.mode==='cas' ? evalCAS(src) : evalCalc(src, forceDec);
    en.input = src; en.mode = S.mode;
    pushHistory(en);
    expr.value=''; onInputChange();
  }catch(err){
    pushHistory({ input:src, mode:S.mode, inTex: mathjsTeX(src) || texText(src), error: friendly(err) });
  }
}
function toggleSD(){
  var en = lastEntry();
  S.exact = !S.exact; updateStatus();
  if(en && en.exTex){ en.showEx = !en.showEx; renderHistory(); }
  save();
}
function action(a){
  switch(a){
    case 'exe': exe(false); break;
    case 'approx': exe(true); break;
    case 'del': smartDelete(); break;
    case 'ac': activeInput.value=''; onInputChange(); break;
    case 'left': moveCaret(-1); break;
    case 'right': moveCaret(1); break;
    case 'home': moveCaret(-999); break;
    case 'end': moveCaret(999); break;
    case 'sd': toggleSD(); break;
  }
}

function findExt(f,a,b){
  var n=600, xs=[], ys=[], out=[];
  for(var i=0;i<=n;i++){ var x=a+(b-a)*i/n; xs.push(x); ys.push(f(x)); }
  for(i=1;i<n;i++){
    if(![ys[i-1],ys[i],ys[i+1]].every(isFinite)) continue;
    if(ys[i]>ys[i-1] && ys[i]>=ys[i+1]){ var xm=golden(f,xs[i-1],xs[i+1],true); out.push(['Máx', xm, f(xm)]); }
    else if(ys[i]<ys[i-1] && ys[i]<=ys[i+1]){ var xn=golden(f,xs[i-1],xs[i+1],false); out.push(['Mín', xn, f(xn)]); }
  }
  return out;
}
function showMarks(lines){ $('#readout').textContent = lines.length ? lines.join('   ') : 'Nada en la ventana visible. Mueve o aleja la gráfica.'; drawGraph(); }
$('#gRoots').onclick = function(){
  var f=selFn(); if(!f){ $('#readout').textContent='Escribe una función en y'+(S.gsel+1)+'.'; return; }
  var r=findRoots(f,S.view.xmin,S.view.xmax).slice(0,8);
  marks = r.map(function(x){ return [x,0]; });
  showMarks(r.map(function(x){ return 'x = '+fmtNum(x,8); }));
};
$('#gExt').onclick = function(){
  var f=selFn(); if(!f){ $('#readout').textContent='Escribe una función en y'+(S.gsel+1)+'.'; return; }
  var r=findExt(f,S.view.xmin,S.view.xmax).slice(0,8);
  marks = r.map(function(m){ return [m[1],m[2]]; });
  showMarks(r.map(function(m){ return m[0]+' ('+fmtNum(m[1],6)+'; '+fmtNum(m[2],6)+')'; }));
};
$('#gInt').onclick = function(){
  var f=selFn(); var j=-1;
  for(var k=1;k<S.funcs.length;k++){ var idx=(S.gsel+k)%S.funcs.length; if(S.funcs[idx].on && S.funcs[idx].e.trim()){ j=idx; break; } }
  if(!f || j<0){ $('#readout').textContent='Hacen falta dos funciones visibles.'; return; }
  var g=getFn(S.funcs[j].e); if(!g) return;
  var r=findRoots(function(x){ return f(x)-g(x); }, S.view.xmin, S.view.xmax).slice(0,8);
  marks = r.map(function(x){ return [x,f(x)]; });
  showMarks(r.map(function(x){ return 'y'+(S.gsel+1)+'∩y'+(j+1)+' ('+fmtNum(x,6)+'; '+fmtNum(f(x),6)+')'; }));
};
$('#gFit').onclick = function(){
  var lo=Infinity, hi=-Infinity, V=S.view;
  S.funcs.forEach(function(fd){ if(!fd.on) return; var f=getFn(fd.e); if(!f) return;
    for(var i=0;i<=400;i++){ var y=f(V.xmin+(V.xmax-V.xmin)*i/400); if(isFinite(y)){ lo=Math.min(lo,y); hi=Math.max(hi,y); } } });
  if(!isFinite(lo)) return; if(hi-lo<1e-9){ lo-=1; hi+=1; }
  var pad=(hi-lo)*0.08; S.view={xmin:V.xmin,xmax:V.xmax,ymin:lo-pad,ymax:hi+pad}; marks=[]; drawGraph(); save();
};
$('#gStd').onclick = function(){ stdView(); marks=[]; drawGraph(); save(); };
$('#gTrace').onclick = function(){
  tracing=!tracing; this.setAttribute('aria-pressed', tracing);
  if(tracing){ traceX = (S.view.xmin+S.view.xmax)/2; } else $('#readout').textContent='Arrastra para mover, pellizca para acercar.';
  drawGraph();
};
$('#gPad').addEventListener('pointerdown', function(e){ e.preventDefault(); });
$('#gPad').onclick = function(){
  var on = this.getAttribute('aria-pressed')!=='true'; this.setAttribute('aria-pressed', on);
  pad.hidden = !on;
  document.querySelectorAll('.frow input').forEach(function(i){ i.setAttribute('inputmode', on?'none':'text'); });
  if(on && activeInput===expr){ var first=document.querySelector('.frow input'); if(first){ activeInput=first; } }
  requestAnimationFrame(drawGraph);
};

/* ---------- Arranque ---------- */
function boot(){
  replayCas(); applyTheme(); renderFuncs(); setMode(S.mode);
  $('#loading').remove();
  if(!isTouch) expr.focus();
}
window.addEventListener('load', boot);
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){ navigator.serviceWorker.register('sw.js'); }
})();
</script>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calcu">
<meta name="theme-color" content="#26313B">
<title>Calcu — calculadora científica</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="lib/mathlive/mathlive-fonts.css">
<link rel="stylesheet" href="lib/mathlive/mathlive-static.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D3D9DE; --ink:#1F2933; --muted:#5B6773; --line:rgba(31,41,51,.14);
  --lcd:#CBD5C5; --lcd-ink:#1C2520; --lcd-muted:#4F5C53; --lcd-dot:rgba(28,37,32,.07); --lcd-edge:#A9B5A3;
  --key:#F4F6F7; --key-num:#FFFFFF; --key-ink:#1F2933; --key-shadow:#AEB7BF;
  --op:#3A6A8C; --op-ink:#FFFFFF; --fn:#C5CDD4;
  --shift:#B87A08; --shift-bg:#E3A21A; --danger:#A8433C; --exe:#2E7A67;
  --chip:#C3CBD2; --sheet:#EDF0F2; --err:#9C2F28; --code:#DDE2E6;
  --g1:#2F6FA3; --g2:#B5452F; --g3:#3E8E5A; --g4:#8A5AAE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  height:100%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="slate"]){
    --bg:#232D36; --ink:#E9EDF1; --muted:#9AA6B2; --line:rgba(255,255,255,.1);
    --lcd:#BCC7B6; --lcd-ink:#161F19; --lcd-muted:#46534A; --lcd-dot:rgba(22,31,25,.08); --lcd-edge:#0F161C;
    --key:#36424E; --key-num:#46535F; --key-ink:#EEF1F4; --key-shadow:#161D24;
    --op:#2F5D7C; --op-ink:#FFFFFF; --fn:#2C3742;
    --shift:#F0B233; --danger:#9A3F39; --exe:#2B7362;
    --chip:#33404C; --sheet:#2B3641; --code:#36424E;
    --g1:#1F5E94; --g2:#A63A25; --g3:#2F7A4A; --g4:#7A4B9E;
  }
}
:root[data-theme="dark"]{
  --bg:#232D36; --ink:#E9EDF1; --muted:#9AA6B2; --line:rgba(255,255,255,.1);
  --lcd:#BCC7B6; --lcd-ink:#161F19; --lcd-muted:#46534A; --lcd-dot:rgba(22,31,25,.08); --lcd-edge:#0F161C;
  --key:#36424E; --key-num:#46535F; --key-ink:#EEF1F4; --key-shadow:#161D24;
  --op:#2F5D7C; --op-ink:#FFFFFF; --fn:#2C3742;
  --shift:#F0B233; --danger:#9A3F39; --exe:#2B7362;
  --chip:#33404C; --sheet:#2B3641; --code:#36424E;
  --g1:#1F5E94; --g2:#A63A25; --g3:#2F7A4A; --g4:#7A4B9E;
}
:root[data-theme="slate"]{
  --bg:#263650; --ink:#EDF1F6; --muted:#A3B1C6; --line:rgba(255,255,255,.12);
  --lcd:#DCE2E5; --lcd-ink:#1A2330; --lcd-muted:#4E5B6B; --lcd-dot:rgba(26,35,48,.06); --lcd-edge:#141E2E;
  --key:#3B4E6D; --key-num:#4A5E80; --key-ink:#F1F4F8; --key-shadow:#16213A;
  --op:#5877A8; --op-ink:#FFFFFF; --fn:#32445F;
  --shift:#F2B640; --danger:#A5463F; --exe:#2F7F6C;
  --chip:#34476A; --sheet:#2E4060; --code:#3B4E6D;
  --g1:#2B64A0; --g2:#B04428; --g3:#2F8050; --g4:#7F4FA6;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--shift-bg);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:6px 10px 8px}

header{display:flex;align-items:center;gap:5px;padding:4px 0 8px}
.tabs{display:flex;flex:1;min-width:0;background:var(--chip);border-radius:10px;padding:3px}
.tabs button{flex:1;padding:7px 0;border-radius:8px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--key-num);color:var(--ink);box-shadow:0 1px 0 var(--key-shadow)}
.iconbtn{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--chip);font-weight:700;font-size:17px}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8}

#screen{flex:1;min-height:0;display:flex;flex-direction:column}
.lcd{
  flex:1;min-height:0;display:flex;flex-direction:column;
  background-color:var(--lcd);color:var(--lcd-ink);
  background-image:radial-gradient(var(--lcd-dot) 1px, transparent 1.2px);
  background-size:4px 4px;
  border-radius:12px;border:2px solid var(--lcd-edge);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.18);
  overflow:hidden;
}
#status{display:flex;gap:6px;padding:6px 10px 2px;font-size:12px;font-weight:600;color:var(--lcd-muted)}
#status span{padding:1px 6px;border:1px solid currentColor;border-radius:4px;line-height:1.3}
#status .on{background:var(--lcd-ink);color:var(--lcd);border-color:var(--lcd-ink)}
#status .shiftflag{display:none}
body.shift #status .shiftflag{display:inline;background:var(--shift-bg);color:#1C1A12;border-color:var(--shift-bg)}
#hist{flex:1;min-height:0;overflow-y:auto;padding:4px 10px;display:flex;flex-direction:column;gap:2px;-webkit-overflow-scrolling:touch}
#hist .empty{margin:auto;text-align:center;color:var(--lcd-muted);font-size:14px;line-height:1.5;max-width:32ch}
#hist .empty button{margin-top:10px;padding:6px 12px;border-radius:6px;background:var(--lcd-ink);color:var(--lcd);font-weight:600;font-size:14px}
.entry{border-bottom:1px solid rgba(0,0,0,.08);padding:4px 0 6px}
.entry .in{color:var(--lcd-muted);overflow-x:auto;font-size:14px;cursor:pointer;text-align:left;white-space:nowrap;padding:2px 0}
.entry .out{overflow-x:auto;text-align:right;cursor:pointer;font-size:20px;white-space:nowrap;padding:3px 0}
.entry .alt{text-align:right;color:var(--lcd-muted);font-size:15px;overflow-x:auto;white-space:nowrap}
.entry .note{text-align:right;color:var(--lcd-muted);font-size:12px;font-style:italic}
.entry .err{text-align:right;color:#9C2F28;font-weight:600;font-size:14px;white-space:normal}
.ML__latex{color:inherit}
#edit{border-top:1px solid rgba(0,0,0,.12);padding:6px 10px 8px}
#preview{min-height:28px;overflow-x:auto;color:var(--lcd-ink);font-size:17px;white-space:nowrap;padding:2px 0}
#preview.bad{opacity:.45}
#preview[hidden]{display:none}
.inrow{display:flex;gap:6px;align-items:center}
#expr,math-field{
  flex:1;min-width:0;
  background:rgba(255,255,255,.35);color:var(--lcd-ink);border:1px solid rgba(0,0,0,.18);
  border-radius:6px;
}
#expr{font:500 20px/1.2 "Barlow",system-ui,sans-serif;padding:6px 8px;-webkit-user-select:text;user-select:text;caret-color:var(--lcd-ink)}
#expr:focus{outline:none;border-color:var(--lcd-ink)}
#expr[hidden],math-field[hidden]{display:none}
math-field{
  font-size:23px;padding:4px 8px;min-height:46px;
  --caret-color:var(--lcd-ink); --selection-background-color:rgba(46,122,103,.25);
  --placeholder-color:var(--lcd-muted); --contains-highlight-background-color:rgba(0,0,0,.05);
  --smart-fence-color:var(--lcd-muted);
}
math-field:focus-within{outline:none;border-color:var(--lcd-ink)}
math-field::part(virtual-keyboard-toggle),math-field::part(menu-toggle){display:none}
.smallbtn{font-size:13px;font-weight:600;padding:6px 9px;border-radius:6px;background:rgba(0,0,0,.08);color:var(--lcd-ink);flex:none}
.smallbtn[aria-pressed="true"]{background:var(--lcd-ink);color:var(--lcd)}

#graph{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#graph[hidden]{display:none}
.funcs{display:grid;gap:4px}
.frow{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:8px;padding:3px 6px}
.frow .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--c);background:var(--c);flex:none}
.frow .dot[aria-pressed="false"]{background:transparent}
.frow .lab{font-weight:600;font-size:14px;width:44px;white-space:nowrap;text-align:left;color:var(--muted);border-radius:4px;padding:2px 4px;flex:none}
.frow.sel .lab{background:var(--ink);color:var(--bg)}
.frow input{flex:1;min-width:0;font:500 16px "Barlow",system-ui,sans-serif;background:var(--key-num);color:var(--key-ink);border:0;border-radius:6px;padding:6px 8px;-webkit-user-select:text;user-select:text}
.canvaswrap{flex:1;min-height:150px;position:relative;border-radius:12px;border:2px solid var(--lcd-edge);overflow:hidden;background:var(--lcd)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#readout{min-height:22px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.35;white-space:pre-wrap}
.gbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.gbar::-webkit-scrollbar{display:none}
.gbar button{flex:none;padding:7px 11px;border-radius:8px;background:var(--chip);font-weight:600;font-size:14px}
.gbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;padding:6px 11px;border-radius:14px;background:var(--chip);font-size:14px;font-weight:600;white-space:nowrap}
#chips:empty{display:none}

#pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#pad[hidden]{display:none}
.key{
  position:relative;height:clamp(40px,6.3vh,58px);border-radius:9px;
  background:var(--key);color:var(--key-ink);box-shadow:0 2px 0 var(--key-shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;transition:transform .05s;
}
.key.down{transform:translateY(2px);box-shadow:0 0 0 var(--key-shadow)}
.key .m{font-size:19px;font-weight:600;line-height:1}
.key .s{font-size:11px;font-weight:600;color:var(--shift);line-height:1;min-height:11px}
.key sup{font-size:.65em}
.key.num{background:var(--key-num)}
.key.num .m{font-size:22px}
.key.op{background:var(--op);color:var(--op-ink)}
.key.op .s{color:#FFD27A}
.key.fnk{background:var(--fn)}
.key.shiftk{background:var(--shift-bg);color:#1C1A12}
.key.shiftk .m{font-size:15px}
.key.danger{background:var(--danger);color:#fff}
.key.danger .s{color:#FFD27A}
.key.exe{background:var(--exe);color:#fff}
.key.exe .s{color:#FFD27A}
.key .frac{display:inline-flex;flex-direction:column;align-items:center;line-height:.9;font-size:13px}
.key .frac i{display:block;width:12px;height:9px;border:1.5px solid currentColor;border-radius:2px}
.key .frac b{display:block;width:16px;height:0;border-top:2px solid currentColor;margin:2px 0}
body.shift .key .s{background:var(--shift-bg);color:#1C1A12;border-radius:3px;padding:0 3px}
body.shift .key.shiftk{outline:2px solid var(--ink)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:92%;
  background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.4;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#toast[hidden]{display:none}
#toast b{display:block;font-size:15px}

#sheetback{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;
  background:var(--sheet);color:var(--ink);border-radius:16px 16px 0 0;
  max-height:86%;display:flex;flex-direction:column;
  padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 24px rgba(0,0,0,.25);
}
#sheet[hidden],#sheetback[hidden]{display:none}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px}
.sheethead h2{margin:0;font-size:18px;font-weight:600;flex:1}
.sheetbody{overflow-y:auto;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-bottom:10px;flex:none}
.cats button{padding:8px 2px;border-radius:10px;background:var(--chip);font-weight:600;font-size:13px;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.cats button{font-size:11.5px;letter-spacing:-.2px}}
#sheet.fixed{height:80%}
#sheet.fixed .sheetbody{flex:1;display:flex;flex-direction:column;overflow:hidden}
#sheet.fixed .items{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;align-content:start;padding-bottom:8px}
.cats button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.item{text-align:left;background:var(--key-num);color:var(--key-ink);border-radius:8px;padding:8px 10px;box-shadow:0 1px 0 var(--key-shadow)}
.item b{display:block;font-size:15px;font-weight:600}
.item small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.setrow{padding:10px 0;border-bottom:1px solid var(--line)}
.setrow > span{display:block;font-weight:600;margin-bottom:6px}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--key-num);color:var(--ink)}
.wide{width:100%;padding:10px;border-radius:9px;background:var(--chip);font-weight:600;margin-top:6px}
.about{font-size:13px;color:var(--muted);line-height:1.5;margin:10px 0 0}

/* Manual */
.msearch{width:100%;font:500 16px "Barlow",system-ui,sans-serif;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--key-num);color:var(--ink);margin-bottom:10px}
.mindex{display:grid;gap:6px}
.mindex button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--key-num);color:var(--key-ink);padding:10px 12px;border-radius:9px;box-shadow:0 1px 0 var(--key-shadow)}
.mindex button b{font-size:16px;font-weight:600}
.mindex button small{font-size:13px;color:var(--muted);margin-top:2px}
.mdoc{font-size:15px;line-height:1.55;max-width:62ch}
.mdoc h3{font-size:19px;margin:4px 0 8px}
.mdoc h4{font-size:15px;margin:16px 0 4px}
.mdoc p{margin:0 0 10px}
.mdoc ul{margin:0 0 10px;padding-left:20px}
.mdoc li{margin-bottom:4px}
.mdoc code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;background:var(--code);padding:1px 5px;border-radius:4px;white-space:nowrap}
.mdoc table{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0 12px}
.mdoc td,.mdoc th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
.mdoc th{font-weight:600}
.mtable{overflow-x:auto}
.try{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.try button{padding:6px 10px;border-radius:8px;background:var(--exe);color:#fff;font-weight:600;font-size:14px;text-align:left}
.try button span{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:500;font-size:13px;opacity:.9;margin-left:4px}
.mnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.mnav button{padding:8px 12px;border-radius:8px;background:var(--chip);font-weight:600;font-size:14px}
.backbtn{padding:6px 10px;border-radius:8px;background:var(--chip);font-weight:600;font-size:14px}

/* Tabla */
.tblctl{display:flex;gap:8px;margin-bottom:8px}
.tblctl label{flex:1;font-size:13px;font-weight:600;color:var(--muted)}
.tblctl input{display:block;width:100%;margin-top:3px;font:500 16px "Barlow",system-ui,sans-serif;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--key-num);color:var(--ink)}
.vtable{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
.vtable th,.vtable td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
.vtable th{position:sticky;top:0;background:var(--sheet);font-weight:600}

.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;font-weight:600;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.key{transition:none}}
</style>
</head>
<body>
<div id="loading" class="loading">Cargando motor matemático…</div>
<div id="app">
  <header>
    <div class="tabs" role="tablist">
      <button role="tab" data-mode="calc" aria-selected="true">Cálculo</button>
      <button role="tab" data-mode="cas" aria-selected="false">CAS</button>
      <button role="tab" data-mode="graph" aria-selected="false">Gráfica</button>
    </div>
    <button class="iconbtn" id="btnHelp" aria-label="Manual de usuario">?</button>
    <button class="iconbtn" id="btnCat" aria-label="Catálogo de funciones">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <button class="iconbtn" id="btnSet" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
    </button>
  </header>

  <section id="screen">
    <div class="lcd" id="lcd">
      <div id="status">
        <span id="stAngle">DEG</span>
        <span id="stExact">Exacto</span>
        <span id="stCas" hidden>Radianes</span>
        <span class="shiftflag">SHIFT</span>
      </div>
      <div id="hist" aria-live="polite"></div>
      <div id="edit">
        <div id="preview" hidden></div>
        <div class="inrow">
          <math-field id="mf" aria-label="Expresión"></math-field>
          <input id="expr" hidden inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Expresión">
          <button class="smallbtn" id="btnKbd" aria-pressed="false" aria-label="Usar teclado del teléfono">abc</button>
        </div>
      </div>
    </div>

    <div id="graph" hidden>
      <div class="funcs" id="funcs"></div>
      <div class="canvaswrap"><canvas id="cv" aria-label="Área de gráfica"></canvas></div>
      <div id="readout">Arrastra para mover, pellizca para acercar. Toca dos veces para volver a la vista estándar.</div>
      <div class="gbar">
        <button id="gTrace" aria-pressed="false">Trazar</button>
        <button id="gRoots">Raíces</button>
        <button id="gExt">Máx/Mín</button>
        <button id="gInt">Intersección</button>
        <button id="gTable">Tabla</button>
        <button id="gFit">Ajustar Y</button>
        <button id="gStd">Estándar</button>
        <button id="gPad" aria-pressed="false">Teclas</button>
      </div>
    </div>
  </section>

  <div id="chips"></div>
  <div id="pad"></div>
</div>

<div id="toast" hidden role="status"></div>
<div id="sheetback" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheethead"><h2 id="sheetTitle"></h2><button class="iconbtn" id="sheetClose" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheetbody" id="sheetBody"></div>
</div>

<script src="lib/math.js"></script>
<script src="lib/nerdamer.all.min.js"></script>

<script>
(function(){

var VERSION = '0.2.1';

var each = function(list, fn){ Array.prototype.forEach.call(list, fn); };

/* ================= Estado ================= */
var KEY = 'calcu.v1';

  history:[], vars:{}, casDefs:[], ans:0, seenManual:false,

    var o = Object.assign({}, S, { vars:vars, history:S.history.slice(-60), ans:(typeof ansVal==='number'?ansVal:0) });
    localStorage.setItem(KEY, JSON.stringify(o));

/* ================= Motor numérico ================= */
try{ math.createUnit('bbl', '158.987294928 liter', {override:true}); }catch(e){}
[['MBD','1000 bbl/day'],['MMBD','1e6 bbl/day'],['Mbbl','1000 bbl'],['MMbbl','1e6 bbl'],['MMBTU','1e6 BTU'],['TM','1 tonne']].forEach(function(u){
  try{ math.createUnit(u[0], u[1]); }catch(e){}
});
var BUILTIN = {};
function makeScope(forceRad){
  var sc = Object.assign({}, userScope);
  var extra = {
    Ans: ansVal,
    ln: function(x){ return math.log(x); },
    nCr: function(a,b){ return math.combinations(a,b); },
    nPr: function(a,b){ return math.permutations(a,b); },
    normpdf: function(x,m,s){ m=m||0; s=s||1; return Math.exp(-0.5*Math.pow((x-m)/s,2))/(s*Math.sqrt(2*Math.PI)); },
    normcdf: function(x,m,s){ m=m||0; s=s||1; return 0.5*(1+math.erf((x-m)/(s*Math.SQRT2))); }
  };
  if(S.angle==='DEG' && !forceRad){
    var k = Math.PI/180;
    var isU = function(x){ return x && typeof x==='object' && x.type==='Unit'; };
    ['sin','cos','tan','sec','csc','cot'].forEach(function(f){
      extra[f] = function(x){ return isU(x) ? math[f](x) : math[f](math.multiply(x,k)); };
    });
    ['asin','acos','atan','asec','acsc','acot'].forEach(function(f){
      extra[f] = function(x){ return math.divide(math[f](x), k); };
    });
    extra.atan2 = function(y,x){ return Math.atan2(y,x)/k; };
  }
  Object.keys(extra).forEach(function(n){ BUILTIN[n]=true; sc[n]=extra[n]; });
  return sc;
}
function prep(s){
  return String(s).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi').replace(/√\(/g,'sqrt(').replace(/∞/g,'Infinity');
}
function isUserFn(name){
  if(typeof userScope[name]==='function') return true;
  for(var i=0;i<S.casDefs.length;i++) if(S.casDefs[i].t==='f' && S.casDefs[i].n===name) return true;
  return false;
}

/* ================= Formato ================= */
function trimZeros(s){ if(s.indexOf('.')<0) return s; s=s.replace(/0+$/,''); return s.replace(/\.$/,''); }
function group(s){
  var neg = s.charAt(0)==='-'; if(neg) s=s.slice(1);
  var p = s.split('.'), i=p[0], f=p[1];
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, S.comma ? '.' : '\u2009');
  return (neg?'-':'') + i + (f ? (S.comma?',':'.') + f : '');
}
function numParts(x, digits){
  digits = digits || S.digits;
  if(!isFinite(x)) return { m: isNaN(x)?'NaN':(x>0?'inf':'-inf'), e:null };
  if(x===0) return {m:'0', e:null};
  var ax = Math.abs(x);
  if(ax>=1e12 || ax<1e-6){
    var p = x.toExponential(digits-1).split('e');
    return { m: group(trimZeros(p[0])), e: parseInt(p[1],10) };
  }
  return { m: group(trimZeros(x.toPrecision(digits))), e:null };
}
function fmtNum(x, digits){
  var p = numParts(x, digits);
  if(p.m==='NaN') return 'indefinido';
  if(p.m==='inf') return '∞'; if(p.m==='-inf') return '−∞';
  var m = p.m.replace('-','−');
  return p.e===null ? m : m + '×10^' + p.e;
}
function texNum(x, digits){
  var p = numParts(x, digits);
  if(p.m==='NaN') return '\\text{indefinido}';
  if(p.m==='inf') return '\\infty'; if(p.m==='-inf') return '-\\infty';
  var m = p.m.replace(/,/g,'{,}').replace(/\u2009/g,'\\,');
  return p.e===null ? m : m + '\\times 10^{' + p.e + '}';
}
function machine(x){ return trimZeros(Number(x).toPrecision(15)).replace(/e\+?/, 'e'); }
function esc(s){ return String(s).replace(/[\\{}$&#^_%~]/g, function(c){ return '\\'+c; }); }
function texText(s){ return '\\text{' + esc(s) + '}'; }

/* ================= TeX ================= */
var FN_TEX = {sin:'\\sin',cos:'\\cos',tan:'\\tan',sec:'\\sec',csc:'\\csc',cot:'\\cot',
  asin:'\\arcsin',acos:'\\arccos',atan:'\\arctan',sinh:'\\sinh',cosh:'\\cosh',tanh:'\\tanh',
  ln:'\\ln',log:'\\ln',exp:'\\exp',arcsin:'\\arcsin',arccos:'\\arccos',arctan:'\\arctan'};
function cleanTeX(t){
  return String(t).replace(/\\mathrm\{([a-z]+)\}(?=\\left\(|\()/g, function(m,f){ return FN_TEX[f] || '\\operatorname{'+f+'}'; })
          .replace(/\\mathrm\{(sin|cos|tan|ln|log|exp|asin|acos|atan|sinh|cosh|tanh|sec|csc|cot)\}/g, function(m,f){ return FN_TEX[f]; })
          .replace(/\\cdot\s*(?=\\?[a-zA-Z(])/g, '\\,');
}
var TEXOPT = {parenthesis:'keep', implicit:'hide'};
function mathjsTeX(expr, forCas){
  var e = prep(expr).trim();
  if(!e) return '';
  if(e.indexOf(';')>=0 && (forCas || S.mode==='cas')){
    var parts = e.split(';').map(function(q){ return q.trim(); }).filter(Boolean);
    var tt = parts.map(function(q){ return mathjsTeX(q, true); });
    return tt.every(Boolean) ? tt.join(';\\;') : null;
  }
  try{
    if(e.indexOf(':=')>=0){
      var p = e.split(':=');
      return cleanTeX(math.parse(p[0]).toTex()) + ':=' + cleanTeX(math.parse(p[1]).toTex(TEXOPT));
    }
    var m = e.match(/^([^=<>!]+)(=|<=|>=|<|>)([^=].*)$/);
    if(m && (forCas || S.mode==='cas' || m[2]!=='=')){
      var rel = {'=':'=','<=':'\\le ','>=':'\\ge ','<':'<','>':'>'}[m[2]];
      return cleanTeX(math.parse(m[1]).toTex(TEXOPT)) + rel + cleanTeX(math.parse(m[3]).toTex(TEXOPT));
    }
    return cleanTeX(math.parse(e).toTex(TEXOPT));
  }catch(err){ return null; }
}
function nTeX(r){ return cleanTeX(r.toTeX()); }
function renderTeX(el, tex){
  try{ el.innerHTML = MathLive.convertLatexToMarkup('\\displaystyle ' + tex); }
  catch(e){ el.textContent = tex; }
}

/* ================= LaTeX (escritura natural) → expresión lineal ================= */
var FUNC_CMD = {'\\sin':'sin','\\cos':'cos','\\tan':'tan','\\sec':'sec','\\csc':'csc','\\cot':'cot',
  '\\arcsin':'asin','\\arccos':'acos','\\arctan':'atan','\\sinh':'sinh','\\cosh':'cosh','\\tanh':'tanh',
  '\\ln':'ln','\\log':'log10','\\exp':'exp','\\det':'det','\\gcd':'gcd','\\max':'max','\\min':'min','\\arg':'arg'};
var INV = {sin:'asin',cos:'acos',tan:'atan',sec:'asec',csc:'acsc',cot:'acot',sinh:'asinh',cosh:'acosh',tanh:'atanh'};
var GREEK = /^\\(alpha|beta|gamma|delta|epsilon|varepsilon|zeta|eta|theta|vartheta|iota|kappa|lambda|mu|nu|xi|rho|sigma|tau|upsilon|phi|varphi|chi|psi|omega|Gamma|Delta|Theta|Lambda|Sigma|Phi|Psi|Omega)$/;
var SKIP = {'\\,':1,'\\;':1,'\\:':1,'\\!':1,'\\ ':1,'\\quad':1,'\\qquad':1,'\\displaystyle':1,'\\textstyle':1,'\\limits':1,'\\nolimits':1};
function tokLatex(s){ return (String(s).match(/\\[a-zA-Z]+|\\.|[0-9]|\s+|./g)||[]).filter(function(t){ return !/^\s+$/.test(t) && t!=='~'; }); }
function PH(){ var e = new Error('Completa los recuadros vacíos'); e.friendly = true; return e; }
function readGroup(T,p){
  if(T[p.i]==='{'){
    var d=0, start=++p.i;
    for(;p.i<T.length;p.i++){ if(T[p.i]==='{') d++; else if(T[p.i]==='}'){ if(d===0) break; d--; } }
    var g = T.slice(start,p.i); p.i++; return g;
  }
  if(p.i>=T.length) throw PH();
  return [T[p.i++]];
}
function groupText(g){ return g.join('').replace(/\\/g,''); }
function sub(tokens){ return join(seq(tokens,{i:0},null)); }
function isCloser(t){ return t===')' || t==='\\right' || t==='\\mright' || t===']' ; }
function untilClose(T,p,closeTok){
  // lee hasta el cierre correspondiente, respetando anidación
  var start=p.i, d=0;
  for(;p.i<T.length;p.i++){
    var t=T[p.i];
    if(t==='\\left' || t==='\\mleft' || t==='(' || t==='{' || t==='[') d++;
    else if(t==='\\right' || t==='\\mright' || t===')' || t==='}' || t===']'){
      if(d===0) break; d--;
      if(t==='\\right' || t==='\\mright') p.i++;
    }
  }
  var inner = T.slice(start,p.i);
  if(T[p.i]==='\\right' || T[p.i]==='\\mright') p.i+=2; else p.i++;
  return inner;
}
function parseArg(T,p){
  var t = T[p.i];
  if(t==='\\left' || t==='\\mleft'){ var dl=T[p.i+1]; p.i+=2; var inner=untilClose(T,p); return dl==='|' ? 'abs('+sub(inner)+')' : sub(inner); }
  if(t==='('){ p.i++; return sub(untilClose(T,p)); }
  if(t==='{'){ return sub(readGroup(T,p)); }
  var one = seq(T,p,null,1);
  if(!one.length) throw PH();
  return join(one);
}
function stopAdd(t){ return t==='+' || t==='-' || t==='=' || t===',' || t===';' || t==='<' || t==='>'; }
function findDiff(T,from){
  var d=0;
  for(var j=from;j<T.length;j++){
    var t=T[j];
    if(t==='{' || t==='\\left' || t==='(') d++;
    else if(t==='}' || t==='\\right' || t===')'){ if(d===0) return null; d--; }
    if(d!==0) continue;
    if((t==='d' || t==='\\differentialD') && /^[a-zA-Z]$/.test(T[j+1]||'')) return {j:j, v:T[j+1], len:2};
    if(t==='\\mathrm' && T[j+1]==='{' && T[j+2]==='d' && T[j+3]==='}' && /^[a-zA-Z]$/.test(T[j+4]||'')) return {j:j, v:T[j+4], len:5};
  }
  return null;
}
function seq(T,p,stop,maxOne){
  var out=[];
  function push(c){ out.push(c); }
  while(p.i<T.length){
    if(maxOne && out.length>=maxOne && T[p.i]!=='^' && T[p.i]!=='_' && T[p.i]!=='!') break;
    var t = T[p.i];
    if(stop && stop(t)) break;
    if(isCloser(t) && t!==']') break;
    if(t==='}') break;
    if(/^[0-9.]$/.test(t)){
      var num=''; while(p.i<T.length && /^[0-9.]$/.test(T[p.i])){ num+=T[p.i]; p.i++; }
      push({t:'num', s:num}); continue;
    }
    p.i++;
    if(t==='^'){
      var g = readGroup(T,p);
      if(g.length===1 && (g[0]==='\\circ')){ push({t:'post', s:' deg'}); continue; }
      var last = out[out.length-1]; if(!last) throw PH();
      var ex = sub(g); if(ex==='') throw PH();
      last.s = (last.t==='num' && /\./.test(last.s) ? '('+last.s+')' : last.s) + '^' + (/^[A-Za-z0-9.]+$/.test(ex) ? ex : '('+ex+')');
      if(last.t==='var' || last.t==='num') last.t = 'grp';
      continue;
    }
    if(t==='_'){
      var gs = readGroup(T,p); var lastv = out[out.length-1];
      if(lastv) lastv.s += '_' + groupText(gs).replace(/[^A-Za-z0-9]/g,'');
      continue;
    }
    if(t==='\\left' || t==='\\mleft'){
      var dl = T[p.i]; p.i++;
      var inner = untilClose(T,p);
      if(dl==='|') push({t:'func', s:'abs('+sub(inner)+')'});
      else if(dl==='[' || dl==='\\lbrack') push({t:'grp', s:'['+sub(inner)+']'});
      else push({t:'grp', s:'('+sub(inner)+')'});
      continue;
    }
    if(t==='('){ push({t:'grp', s:'('+sub(untilClose(T,p))+')'}); continue; }
    if(t==='['){ push({t:'grp', s:'['+sub(untilClose(T,p))+']'}); continue; }
    if(t==='{'){ p.i--; push({t:'grp', s:'('+sub(readGroup(T,p))+')'}); continue; }
    if(t==='|'){
      var st=p.i; while(p.i<T.length && T[p.i]!=='|') p.i++;
      var ab = T.slice(st,p.i); p.i++;
      push({t:'func', s:'abs('+sub(ab)+')'}); continue;
    }
    if(t==='!'){ var l2 = out[out.length-1]; if(!l2) throw PH(); push({t:'post', s:'!'}); continue; }
    if('+-=<>,;/*:'.indexOf(t)>=0){ push({t:'op', s:t}); continue; }
    if(/^[a-zA-Z]$/.test(t)){ push({t:'var', s:t}); continue; }
    if(t.charAt(0)!=='\\'){ continue; }
    if(SKIP[t]) continue;
    if(t==='\\placeholder'){ throw PH(); }
    if(t==='\\frac' || t==='\\dfrac' || t==='\\tfrac'){
      var A = readGroup(T,p), B = readGroup(T,p);
      var sA = sub(A), sB = sub(B);
      if(sA==='' || sB==='') throw PH();
      var dm = sB.replace(/\s|\*/g,'').match(/^d([a-zA-Z])(\^\(?(\d)\)?)?$/);
      if((sA==='d' || /^d\^\(?\d\)?$/.test(sA)) && dm){
        var order = dm[3] ? ','+dm[3] : '';
        var arg = parseArg(T,p);
        push({t:'func', s:'diff('+arg+','+dm[1]+order+')'});
      }else push({t:'grp', s:'(('+sA+')/('+sB+'))'});
      continue;
    }
    if(t==='\\sqrt'){
      var n = null;
      if(T[p.i]==='['){ p.i++; var ns=p.i; while(p.i<T.length && T[p.i]!==']') p.i++; n = sub(T.slice(ns,p.i)); p.i++; if(n==='') throw PH(); }
      var rad = sub(readGroup(T,p)); if(rad==='') throw PH();
      push({t:'func', s: n ? 'nthRoot('+rad+','+n+')' : 'sqrt('+rad+')'}); continue;
    }
    if(FUNC_CMD[t]){
      var fname = FUNC_CMD[t], pow = '', base = null;
      if(T[p.i]==='_' && t==='\\log'){ p.i++; base = sub(readGroup(T,p)); }
      if(T[p.i]==='^'){
        p.i++; var pg = sub(readGroup(T,p));
        if(pg==='-1' && INV[fname]) fname = INV[fname]; else pow = '^('+pg+')';
      }
      var farg = parseArg(T,p);
      var call = base ? (base==='10' ? 'log10('+farg+')' : 'log('+farg+','+base+')') : fname+'('+farg+')';
      push({t:'func', s: call + pow}); continue;
    }
    if(t==='\\operatorname' || t==='\\mathrm' || t==='\\text' || t==='\\mathit' || t==='\\textrm' || t==='\\mathbf'){
      var w = groupText(readGroup(T,p)).trim();
      if(w==='to'){ push({t:'op', s:' to '}); continue; }
      if(w==='mod'){ push({t:'op', s:' mod '}); continue; }
      if(w===''){ continue; }
      var nx = T[p.i];
      if((nx==='(' || nx==='\\left' || nx==='\\mleft') && (t==='\\operatorname' || w.length>1)){
        var argsTxt = parseArg(T,p);
        push({t:'func', s: w+'('+argsTxt+')'}); continue;
      }
      push({t:(w.length===1 ? 'var' : 'word'), s:w}); continue;
    }
    if(t==='\\int'){
      var lo=null, hi=null;
      for(var k=0;k<2;k++){
        if(T[p.i]==='_'){ p.i++; lo = sub(readGroup(T,p)); }
        else if(T[p.i]==='^'){ p.i++; hi = sub(readGroup(T,p)); }
      }
      var fd = findDiff(T,p.i), integrand, v='x';
      if(fd){ integrand = sub(T.slice(p.i, fd.j)); v = fd.v; p.i = fd.j + fd.len; }
      else { integrand = join(seq(T,p,null)); }
      if(integrand==='') throw PH();
      if(lo!==null || hi!==null){
        if(!lo || !hi) throw PH();
        push({t:'func', s:'defint('+integrand+','+lo+','+hi+','+v+')'});
      }else push({t:'func', s:'integrate('+integrand+','+v+')'});
      continue;
    }
    if(t==='\\sum' || t==='\\prod'){
      var lower='', upper='';
      for(var k2=0;k2<2;k2++){
        if(T[p.i]==='_'){ p.i++; lower = sub(readGroup(T,p)); }
        else if(T[p.i]==='^'){ p.i++; upper = sub(readGroup(T,p)); }
      }
      var lm = lower.match(/^([A-Za-z]\w*)=(.+)$/); if(!lm || !upper) throw PH();
      var body = join(seq(T,p,stopAdd)); if(body==='') throw PH();
      push({t:'func', s:(t==='\\sum'?'sum(':'product(')+body+','+lm[1]+','+lm[2]+','+upper+')'}); continue;
    }
    if(t==='\\lim'){
      var lg = [];
      if(T[p.i]==='_'){ p.i++; lg = readGroup(T,p); }
      var ti = -1; for(var q=0;q<lg.length;q++){ if(lg[q]==='\\to' || lg[q]==='\\rightarrow' || lg[q]==='\\longrightarrow'){ ti=q; break; } }
      if(ti<0) throw PH();
      var lv = sub(lg.slice(0,ti)), la = sub(lg.slice(ti+1));
      if(!lv || !la) throw PH();
      var lb = join(seq(T,p,stopAdd)); if(lb==='') throw PH();
      push({t:'func', s:'limit('+lb+','+lv+','+la+')'}); continue;
    }
    if(t==='\\begin'){
      var env = groupText(readGroup(T,p));
      var ms = p.i; while(p.i<T.length && T[p.i]!=='\\end') p.i++;
      var body2 = T.slice(ms,p.i); p.i++; readGroup(T,p);
      if(/matrix|array/.test(env)){
        var rows=[[]], cell=[];
        body2.forEach(function(x){
          if(x==='&'){ rows[rows.length-1].push(cell); cell=[]; }
          else if(x==='\\\\'){ rows[rows.length-1].push(cell); cell=[]; rows.push([]); }
          else cell.push(x);
        });
        rows[rows.length-1].push(cell);
        rows = rows.filter(function(r){ return r.some(function(c){ return c.length; }); });
        push({t:'grp', s:'['+rows.map(function(r){ return r.map(function(c){ var v2=sub(c); if(v2==='') throw PH(); return v2; }).join(','); }).join(';')+']'});
      }
      continue;
    }
    if(t==='\\pi'){ push({t:'var', s:'pi'}); continue; }
    if(t==='\\infty'){ push({t:'var', s:'Infinity'}); continue; }
    if(t==='\\exponentialE'){ push({t:'var', s:'e'}); continue; }
    if(t==='\\imaginaryI'){ push({t:'var', s:'i'}); continue; }
    if(t==='\\cdot' || t==='\\times' || t==='\\ast'){ push({t:'op', s:'*'}); continue; }
    if(t==='\\div'){ push({t:'op', s:'/'}); continue; }
    if(t==='\\le' || t==='\\leq'){ push({t:'op', s:'<='}); continue; }
    if(t==='\\ge' || t==='\\geq'){ push({t:'op', s:'>='}); continue; }
    if(t==='\\ne' || t==='\\neq'){ push({t:'op', s:'!='}); continue; }
    if(t==='\\lt'){ push({t:'op', s:'<'}); continue; }
    if(t==='\\gt'){ push({t:'op', s:'>'}); continue; }
    if(t==='\\coloneq' || t==='\\coloneqq'){ push({t:'op', s:':='}); continue; }
    if(t==='\\colon'){ push({t:'op', s:':'}); continue; }
    if(t==='\\to' || t==='\\rightarrow'){ push({t:'op', s:' to '}); continue; }
    if(t==='\\%'){ push({t:'post', s:'/100'}); continue; }
    if(t==='\\degree' || t==='\\circ'){ push({t:'post', s:' deg'}); continue; }
    if(t==='\\lbrace' || t==='\\rbrace' || t==='\\{' || t==='\\}') continue;
    if(GREEK.test(t)){ push({t:'var', s:t.slice(1)}); continue; }
    push({t:'word', s:t.slice(1)});
  }
  return out;
}
var LEFTM = {num:1,var:1,word:1,grp:1,func:1,post:1}, RIGHTM = {num:1,var:1,word:1,grp:1,func:1};
function join(ch){
  var o='', prev=null;
  for(var i=0;i<ch.length;i++){
    var c = ch[i];
    if(prev && LEFTM[prev.t] && RIGHTM[c.t]){
      var fnCall = (prev.t==='var' || prev.t==='word') && c.t==='grp' && c.s.charAt(0)==='(' && isUserFn(prev.s);
      if(!fnCall) o += '*';
    }
    o += c.s; prev = c;
  }
  return o.replace(/:\s*=/g, ':=');
}
function latexToExpr(tex){
  var T = tokLatex(tex);

    [/Unexpected end of expression/, function(){ return 'Expresión incompleta'; }],
    [/Parenthesis \) expected/, function(){ return 'Falta cerrar un paréntesis'; }],
    [/Unexpected operator/, function(){ return 'Operador fuera de lugar'; }],
    [/Value expected/, function(){ return 'Falta un valor'; }],
    [/Dimension mismatch|Dimensions mismatch/, function(){ return 'Las dimensiones de las matrices no coinciden'; }],
    [/Units do not match/, function(){ return 'Las unidades no son compatibles entre sí'; }],
    [/Unit .* not found/, function(){ return 'Unidad no reconocida. Revisa el Catálogo → Unidades.'; }],
    [/Division by zero/i, function(){ return 'División entre cero'; }],
    [/Too many arguments|Too few arguments/, function(){ return 'Número de argumentos incorrecto'; }],
    [/not a valid variable name/, function(){ return 'Nombre de variable no válido'; }],
    [/Matrix must be square|singular/i, function(){ return 'La matriz no es invertible o no es cuadrada'; }]
  ];
  for(var i=0;i<rules.length;i++){ var mm = m.match(rules[i][0]); if(mm) return rules[i][1](mm); }
  return 'No pude interpretar la expresión (' + m + ')';
}

function renderHistory(){

function pushHistory(en){

function readSource(){

function exe(forceDec, given){
  intStage = 0;
  if(S.mode==='graph'){ drawGraph(); if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); return; }
  var src;
  try{ src = given || readSource(); }
  catch(err){ pushHistory({ input:'', latex: mf.value, mode:S.mode, inTex: mf.value, error: friendly(err) }); return; }
  if(!src) return;
  var inTex = src.latex || mathjsTeX(src.lin) || texText(src.lin);
  try{
    var en = S.mode==='cas' ? evalCAS(src.lin) : evalCalc(src.lin, forceDec);

    pushHistory(en);
    if(!given){ if(S.input==='natural'){ mf.value=''; } else { expr.value=''; onInputChange(); } }
  }catch(err){
    pushHistory({ input:src.lin, latex:src.latex, mode:S.mode, inTex: inTex, error: friendly(err) });
  }
}
function toggleSD(){
  var en = lastEntry();

}
function action(a){

    case 'ac': clearInput(); break;

    case 'right': moveCaret(1); break;
    case 'home': moveCaret(-999); break;
    case 'end': moveCaret(999); break;
    case 'sd': toggleSD(); break;
  }
}

/* Toque fiable: solo cuenta si el dedo empieza y termina en el mismo botón sin desplazarse */
function onTap(el, fn){
  var st = null;
  el.addEventListener('pointerdown', function(e){ st = {x:e.clientX, y:e.clientY, id:e.pointerId}; if(el.dataset.keepfocus) e.preventDefault(); });
  el.addEventListener('pointercancel', function(){ st = null; });
  el.addEventListener('pointerup', function(e){
    if(!st || st.id!==e.pointerId) return;
    var moved = Math.hypot(e.clientX-st.x, e.clientY-st.y) > 10; st = null;
    var r = el.getBoundingClientRect();
    var inside = e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;
    if(!moved && inside){ el.dataset.tapped = '1'; fn(e); }
  });
  el.addEventListener('click', function(e){
    e.preventDefault();
    if(el.dataset.tapped){ delete el.dataset.tapped; return; }
    if(e.detail===0) fn(e); // teclado físico / accesibilidad
  });
}

/* Plantilla lineal → plantilla natural */
function unitLatex(u){ return u.replace(/[A-Za-z]+/g, function(w){ return '\\mathrm{'+w+'}'; }); }
function linToLatexTemplate(t){
  t = String(t);
  if(t.trim()==='to') return '\\operatorname{to}';
  if(/^ to $/.test(t)) return '\\operatorname{to}';
  var m = t.match(/^([a-zA-Z]\w*)\(([^()]*)\)$/);
  if(m){
    var inner = m[2]==='' ? '' : m[2].split(',').map(function(a){ a=a.replace(/§/g,'').trim(); return a==='' ? '#?' : (mathjsTeX(a) || a); }).join(',');
    return '\\operatorname{'+m[1]+'}\\left('+inner+'\\right)';
  }
  var m2 = t.match(/^([a-zA-Z]\w*)\($/);
  if(m2){
    var cmd = FUNC_CMD['\\'+m2[1]] ? '\\'+m2[1] : '\\operatorname{'+m2[1]+'}';
    return cmd+'\\left(#?\\right)';
  }
  if(/^\[/.test(t)) return '\\begin{pmatrix}#?&#?\\\\#?&#?\\end{pmatrix}';
  if(/^[A-Za-z][A-Za-z0-9]*$/.test(t)) return t.length===1 ? t : (t==='pi' ? '\\pi' : '\\mathrm{'+t+'}');
  if(/^[A-Za-z0-9/^]+$/.test(t)) return unitLatex(t);
  return t.replace(/§/g,'#?');
}

function drawRelation(c, i, X, Y, W, H, V){
  var g = getFxy(c.g); if(!g) return;

  for(var j=0;j<=ny;j++){ var y = V.ymax - j*step/H*(V.ymax-V.ymin);
    for(var k=0;k<=nx;k++){ vals[j*(nx+1)+k] = g(V.xmin + k*step/W*(V.xmax-V.xmin), y); } }
  var col = colorOf(i);
  if(c.kind==='ineq'){
    var gt = c.op==='>' || c.op==='>=';
    ctx.fillStyle = hexA(col, .22);
    for(j=0;j<ny;j++) for(k=0;k<nx;k++){
      var cv0 = (vals[j*(nx+1)+k]+vals[j*(nx+1)+k+1]+vals[(j+1)*(nx+1)+k]+vals[(j+1)*(nx+1)+k+1])/4;

  for(j=0;j<ny;j++) for(k=0;k<nx;k++){
    var a=vals[j*(nx+1)+k], b=vals[j*(nx+1)+k+1], d=vals[(j+1)*(nx+1)+k], e2=vals[(j+1)*(nx+1)+k+1];
    if(!(isFinite(a)&&isFinite(b)&&isFinite(d)&&isFinite(e2))) continue;
    var pts=[], x0=k*step, y0=j*step;
    if((a>0)!==(b>0)) pts.push([x0+step*a/(a-b), y0]);
    if((b>0)!==(e2>0)) pts.push([x0+step, y0+step*b/(b-e2)]);
    if((d>0)!==(e2>0)) pts.push([x0+step*d/(d-e2), y0+step]);
    if((a>0)!==(d>0)) pts.push([x0, y0+step*a/(a-d)]);
    var mx = Math.max(Math.abs(a),Math.abs(b),Math.abs(d),Math.abs(e2));

  for(var gx=Math.ceil(V.xmin/xs)*xs; gx<=V.xmax; gx+=xs){ ctx.moveTo(Math.round(X(gx))+.5,0); ctx.lineTo(Math.round(X(gx))+.5,H); }
  for(var gy=Math.ceil(V.ymin/ys)*ys; gy<=V.ymax; gy+=ys){ ctx.moveTo(0,Math.round(Y(gy))+.5); ctx.lineTo(W,Math.round(Y(gy))+.5); }
  ctx.stroke();
  var ax = Math.min(Math.max(Y(0),0),H), ay = Math.min(Math.max(X(0),0),W);
  ctx.strokeStyle = ink; ctx.globalAlpha=.7; ctx.beginPath();
  ctx.moveTo(0,Math.round(ax)+.5); ctx.lineTo(W,Math.round(ax)+.5); ctx.moveTo(Math.round(ay)+.5,0); ctx.lineTo(Math.round(ay)+.5,H); ctx.stroke();
  ctx.globalAlpha=1; ctx.fillStyle=ink; ctx.font='11px Barlow, system-ui, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(gx=Math.ceil(V.xmin/xs)*xs; gx<=V.xmax; gx+=xs){ if(Math.abs(gx)<xs/2 || X(gx)<14 || X(gx)>W-14) continue; ctx.fillText(shortNum(gx,xs), X(gx), Math.min(ax+3, H-14)); }
  ctx.textAlign='left'; ctx.textBaseline='middle';
  for(gy=Math.ceil(V.ymin/ys)*ys; gy<=V.ymax; gy+=ys){ if(Math.abs(gy)<ys/2 || Y(gy)<8 || Y(gy)>H-8) continue; ctx.fillText(shortNum(gy,ys), Math.min(ay+4, W-30), Y(gy)); }
  S.funcs.forEach(function(f,i){
    if(!f.on) return; var c = classify(f.e); if(!c || c.kind==='bad') return;
    if(c.kind!=='fx'){ drawRelation(c, i, X, Y, W, H, V); return; }
    var fn = getFn(f.e); if(!fn) return;
    ctx.strokeStyle = colorOf(i); ctx.lineWidth = S.gsel===i ? 2.6 : 2; ctx.beginPath();
    var pen=false, py=null, step = dragging ? 1 : 0.5;
    for(var px=0; px<=W; px+=step){
      var x = V.xmin + px/sx, y = fn(x);

      cy = Math.max(-H*2, Math.min(H*3, cy));
      if(pen) ctx.lineTo(px,cy); else { ctx.moveTo(px,cy); pen=true; }

  });

    ctx.fillStyle = st.getPropertyValue('--lcd'); ctx.strokeStyle = ink; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(X(m[0]), Y(m[1]), 5, 0, 7); ctx.fill(); ctx.stroke();
  });
  if(tracing && traceX!==null){
    var tf = getFn((S.funcs[S.gsel]||{}).e);
    ctx.strokeStyle=ink; ctx.setLineDash([4,4]); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(X(traceX),0); ctx.lineTo(X(traceX),H); ctx.stroke(); ctx.setLineDash([]);
    if(tf){ var ty=tf(traceX); if(isFinite(ty)){ ctx.fillStyle=colorOf(S.gsel); ctx.beginPath(); ctx.arc(X(traceX),Y(ty),6,0,7); ctx.fill();

  }
}
function toWorld(px,py){ var V=S.view, W=cv.clientWidth, H=cv.clientHeight; return [V.xmin+px/W*(V.xmax-V.xmin), V.ymin+(H-py)/H*(V.ymax-V.ymin)]; }
var ptrs = new Map(), pinch0 = null, lastTap = 0;
cv.addEventListener('pointerdown', function(e){
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.offsetX, y:e.offsetY});

  if(ptrs.size===1){
    var now = Date.now(); if(now-lastTap<300){ stdView(); marks=[]; drawGraph(); save(); } lastTap = now;

});
cv.addEventListener('pointermove', function(e){
  if(!ptrs.has(e.pointerId)) return;

  var V=S.view, W=cv.clientWidth, H=cv.clientHeight;
  if(ptrs.size===2 && pinch0){
    var p=Array.from(ptrs.values()), d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); if(d<10) return;

function endPtr(e){ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=null; if(!ptrs.size && dragging){ dragging=false; drawGraph(); } save(); }
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);

new ResizeObserver(function(){ drawGraph(); }).observe(cv);

function selFn(){ var f=S.funcs[S.gsel]; return f && f.e.trim() ? getFn(f.e) : null; }
function needFx(){ var c = classify((S.funcs[S.gsel]||{}).e); if(c && c.kind!=='fx'){ $('#readout').textContent = 'El análisis funciona con funciones y = f(x). y'+(S.gsel+1)+' es una relación.'; return true; } return false; }
function golden(f,a,b,max){
  var g=(Math.sqrt(5)-1)/2, c=b-g*(b-a), d=a+g*(b-a), s=max?-1:1;
  for(var i=0;i<100;i++){ if(s*f(c)<s*f(d)) b=d; else a=c; c=b-g*(b-a); d=a+g*(b-a); }
  return (a+b)/2;
}
function findExt(f,a,b){
  var n=600, xs=[], ys=[], out=[];
  for(var i=0;i<=n;i++){ var x=a+(b-a)*i/n; xs.push(x); ys.push(f(x)); }
  for(i=1;i<n;i++){
    if(![ys[i-1],ys[i],ys[i+1]].every(isFinite)) continue;
    if(ys[i]>ys[i-1] && ys[i]>=ys[i+1]){ var xm=golden(f,xs[i-1],xs[i+1],true); out.push(['Máx', xm, f(xm)]); }
    else if(ys[i]<ys[i-1] && ys[i]<=ys[i+1]){ var xn=golden(f,xs[i-1],xs[i+1],false); out.push(['Mín', xn, f(xn)]); }
  }
  return out;
}
function showMarks(lines){ $('#readout').textContent = lines.length ? lines.join('   ') : 'Nada en la ventana visible. Mueve o aleja la gráfica.'; drawGraph(); }

$('#gInt').onclick = function(){
  if(needFx()) return;
  var f=selFn(); var j=-1;
  for(var k=1;k<S.funcs.length;k++){ var idx=(S.gsel+k)%S.funcs.length; if(S.funcs[idx].on && getFn(S.funcs[idx].e)){ j=idx; break; } }
  if(!f || j<0){ $('#readout').textContent='Hacen falta dos funciones y = f(x) visibles.'; return; }
  var g=getFn(S.funcs[j].e);
  var r=numRoots(function(x){ return f(x)-g(x); }, S.view.xmin, S.view.xmax, 900).slice(0,8);
  marks = r.map(function(x){ return [x,f(x)]; });
  showMarks(r.map(function(x){ return 'y'+(S.gsel+1)+'∩y'+(j+1)+' ('+fmtNum(x,6)+'; '+fmtNum(f(x),6)+')'; }));
};
$('#gFit').onclick = function(){
  var lo=Infinity, hi=-Infinity, V=S.view;
  S.funcs.forEach(function(fd){ if(!fd.on) return; var f=getFn(fd.e); if(!f) return;
    for(var i=0;i<=400;i++){ var y=f(V.xmin+(V.xmax-V.xmin)*i/400); if(isFinite(y)){ lo=Math.min(lo,y); hi=Math.max(hi,y); } } });
  if(!isFinite(lo)) return; if(hi-lo<1e-9){ lo-=1; hi+=1; }
  var p=(hi-lo)*0.08; S.view={xmin:V.xmin,xmax:V.xmax,ymin:lo-p,ymax:hi+p}; marks=[]; drawGraph(); save();
};
$('#gStd').onclick = function(){ stdView(); marks=[]; drawGraph(); save(); };
$('#gTrace').onclick = function(){

function openTable(){

  body.appendChild(ctl); body.appendChild(wrap);
  function num(id, d){ var v = Number(String(body.querySelector(id).value).replace(',','.')); return isFinite(v) ? v : d; }
  function build(){
    var a=num('#tStart',-5), h=num('#tStep',1), n=Math.min(200, Math.max(1, Math.round(num('#tRows',21))));

    var t = '<table class="vtable"><thead><tr><th>x</th>' + cols.map(function(c){ return '<th style="color:'+colorOf(c[0])+'">y'+(c[0]+1)+'</th>'; }).join('') + '</tr></thead><tbody>';

 {id:'escritura', t:'Escritura natural y lineal', d:'Escribir como en el cuaderno o en una sola línea',

 {id:'cas', t:'Modo CAS', d:'Derivar, integrar, límites, Taylor, factorizar',
  h:'<p>En CAS las letras son símbolos: <code>x^2+2x</code> no necesita valor. Los resultados son exactos y el CAS trabaja siempre en <b>radianes</b>. Los atajos sobre el teclado insertan cada comando con sus recuadros.</p><div class="mtable"><table><tr><th>Comando</th><th>Qué hace</th></tr><tr><td><code>diff(f, x)</code></td><td>Derivada; <code>diff(f, x, 2)</code> segunda derivada</td></tr><tr><td><code>integrate(f, x)</code></td><td>Integral indefinida (+C)</td></tr><tr><td><code>defint(f, a, b, x)</code></td><td>Integral definida; admite <code>Infinity</code></td></tr><tr><td><code>nint(f, a, b, x)</code></td><td>Integral definida numérica</td></tr><tr><td><code>limit(f, x, a)</code></td><td>Límite; <code>a</code> puede ser <code>Infinity</code></td></tr><tr><td><code>taylor(f, x, n, a)</code></td><td>Serie de Taylor de orden n alrededor de a</td></tr><tr><td><code>factor</code>, <code>expand</code>, <code>simplify</code></td><td>Factorizar, expandir, simplificar</td></tr><tr><td><code>partfrac(f, x)</code></td><td>Fracciones parciales</td></tr><tr><td><code>sum(f, k, a, b)</code></td><td>Sumatoria</td></tr></table></div><h4>Cómo resuelve</h4><p>Primero intenta con Nerdamer. Si no encuentra la respuesta, o la respuesta no pasa una comprobación (por ejemplo, que la derivada de la primitiva devuelva el integrando), prueba con Algebrite. Si ninguno lo logra y el problema tiene un valor numérico, lo calcula numéricamente y lo indica debajo del resultado.</p>',
  ex:[{m:'cas',e:'diff(x^3*sin(x),x)'},{m:'cas',e:'integrate(x^2*ln(x),x)'},{m:'cas',e:'integrate(1/(x^3+1),x)'},{m:'cas',e:'defint(e^(-x^2),0,Infinity,x)'},{m:'cas',e:'limit(sin(x)/x,x,0)'},{m:'cas',e:'taylor(cos(x),x,6,0)'},{m:'cas',e:'factor(x^4-1)'}]},
 {id:'ecuaciones', t:'Ecuaciones y sistemas', d:'Soluciones exactas y numéricas',
  h:'<p>En CAS escribe la ecuación con <b>=</b> (SHIFT + coma) y pulsa EXE. Para un sistema, separa las ecuaciones con <b>;</b> (SHIFT + 9).</p><ul><li>Si hay solución exacta, aparece con su valor aproximado debajo.</li><li>Si la forma exacta es muy larga (típico en cúbicas), se muestra el valor decimal; <b>S⇔D</b> enseña la exacta.</li><li>Si no hay solución exacta (por ejemplo <code>cos(x) = x</code>), se busca numéricamente entre −100 y 100. En ecuaciones periódicas se muestran las 8 soluciones más cercanas a cero.</li><li>Para buscar en un intervalo concreto: <code>nsolve(ecuación, x, a, b)</code>.</li></ul>',
  ex:[{m:'cas',e:'x^2-5x+6=0'},{m:'cas',e:'2x+y=5; x-y=1'},{m:'cas',e:'x^3-2x-5=0'},{m:'cas',e:'cos(x)=x'},{m:'cas',e:'nsolve(sin(x)=0.5,x,0,10)'}]},
 {id:'definir', t:'Variables y funciones en CAS', d:'Definir con := y consultarlas',
  h:'<p>En CAS se define con <b>:=</b> (SHIFT + 2):</p><ul><li><code>a := 3</code> guarda un valor o expresión.</li><li><code>f(x) := x^2+1</code> define una función que luego usas como <code>f(2)</code> o <code>diff(f(x), x)</code>.</li></ul><p>Todas las variables, de Cálculo y de CAS, se ven y se borran en <b>Catálogo → Variables</b>.</p>',
  ex:[{m:'cas',e:'f(x):=x^2+1'},{m:'cas',e:'diff(f(x),x)'}]},
 {id:'grafica', t:'Gráficas', d:'Dibujar, mover, trazar y analizar',
  h:'<p>Escribe hasta cuatro expresiones en <b>y1…y4</b> usando x. El círculo de color muestra u oculta cada una; tocar la etiqueta <b>y1 =</b> la selecciona para el análisis.</p><ul><li><b>Arrastra</b> para mover, <b>pellizca</b> para acercar o alejar, <b>toca dos veces</b> para volver a la vista estándar.</li><li><b>Trazar</b>: arrastra el dedo sobre la gráfica para leer coordenadas de la función seleccionada.</li><li><b>Raíces</b>, <b>Máx/Mín</b> e <b>Intersección</b> analizan la parte visible de la gráfica.</li><li><b>Ajustar Y</b> escala el eje vertical a lo visible; <b>Estándar</b> vuelve a −10…10.</li><li><b>Teclas</b> muestra el teclado de la calculadora para escribir funciones.</li></ul><p>Las gráficas usan siempre radianes.</p>',
  ex:[{m:'graph',e:'x^3-3x'},{m:'graph',e:'sin(x)/x'}]},
 {id:'implicitas', t:'Relaciones y desigualdades', d:'Círculos, elipses y regiones sombreadas',
  h:'<p>Además de funciones, puedes escribir cualquier relación entre x e y:</p><ul><li><code>x^2+y^2=9</code> dibuja un círculo; <code>x=3</code>, una recta vertical.</li><li><code>y>x^2-2</code> o <code>x^2/9+y^2/4<=1</code> sombrean la región. Con &lt; o &gt; el borde es discontinuo; con ≤ o ≥, continuo.</li></ul><p>Trazar, Raíces, Máx/Mín, Intersección y Tabla funcionan solo con funciones de la forma y = f(x).</p>',
  ex:[{m:'graph',e:'x^2+y^2=9'},{m:'graph',e:'y>x^2-2'},{m:'graph',e:'x^2/9+y^2/4<=1'}]},
 {id:'tabla', t:'Tabla de valores', d:'Valores de las funciones paso a paso',
  h:'<p>En Gráfica pulsa <b>Tabla</b>. Ajusta el valor inicial de x, el paso y el número de filas; la tabla se actualiza al escribir y muestra todas las funciones visibles.</p>', ex:[]},
 {id:'ajustes', t:'Ajustes', d:'Escritura, tema, ángulos y formato',
  h:'<ul><li><b>Escritura</b>: natural o lineal.</li><li><b>Tema</b>: automático (según el teléfono), Marfil, Grafito o Pizarra.</li><li><b>Ángulos en Cálculo</b>: grados o radianes (CAS y Gráfica usan siempre radianes).</li><li><b>Formato de números</b> y <b>dígitos significativos</b>.</li><li><b>Resultado por defecto</b>: exacto o decimal.</li><li><b>Borrar historial</b>.</li></ul>', ex:[]},
 {id:'errores', t:'Mensajes de error', d:'Qué significan y cómo resolverlos',
  h:'<table><tr><th>Mensaje</th><th>Qué hacer</th></tr><tr><td>Completa los recuadros vacíos</td><td>Hay una plantilla sin llenar; muévete con ◀ ▶ y complétala.</td></tr><tr><td>La variable x no tiene valor</td><td>En Cálculo, x necesita valor (<code>x = 2</code>). Para trabajar con x simbólicamente, usa CAS.</td></tr><tr><td>Falta cerrar un paréntesis</td><td>Revisa que cada ( tenga su ).</td></tr><tr><td>Función no definida</td><td>Escribiste algo como <code>a(2)</code> sin definir a. Si querías multiplicar, usa ×.</td></tr><tr><td>Las unidades no son compatibles</td><td>Estás convirtiendo magnitudes distintas, como volumen a masa.</td></tr><tr><td>No encontré una primitiva</td><td>La integral no tiene forma cerrada conocida; usa la integral definida para obtener un valor.</td></tr><tr><td>No encontré soluciones reales</td><td>Prueba <code>nsolve(ecuación, x, a, b)</code> con otro intervalo, o revisa si solo hay soluciones complejas.</td></tr></table>', ex:[]},
 {id:'instalar', t:'Instalación y actualizaciones', d:'Uso sin conexión y versiones nuevas',
  h:'<p>Una vez instalada desde el navegador, la app funciona con o sin internet. Cuando se publica una versión nueva, se descarga sola en segundo plano y se aplica la próxima vez que cierres y abras la app.</p><p>El historial, las variables y los ajustes se guardan solo en tu teléfono.</p>', ex:[]}
];
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function keyTable(){
  var rows = [];
  KEYS.forEach(function(r){ r.forEach(function(k){ rows.push('<tr><td><b>'+plain(k.m)+'</b></td><td>'+(k.d||'')+'</td><td>'+(k.s ? '<b>'+k.s+'</b>: '+(k.sd||'') : '')+'</td></tr>'); }); });
  return '<div class="mtable"><table><tr><th>Tecla</th><th>Función</th><th>Con SHIFT</th></tr>'+rows.join('')+'</table></div>';
}
function openManual(id){
  S.seenManual = true; save();
  var body = document.createElement('div');
  if(id){ showSection(body, id); }
  else showIndex(body, '');
  openSheet('Manual de usuario', body);
}
function showIndex(body, q){
  body.innerHTML = '';
  var inp = document.createElement('input'); inp.className='msearch'; inp.type='search'; inp.placeholder='Buscar: integral, unidades, matriz…'; inp.value=q||'';
  inp.setAttribute('aria-label','Buscar en el manual');
  var list = document.createElement('div'); list.className='mindex';
  function fill(){
    list.innerHTML='';
    var nq = norm(inp.value.trim());
    var found = MANUAL.filter(function(s){ return !nq || norm(s.t+' '+s.d+' '+s.h.replace(/<[^>]+>/g,' ')).indexOf(nq)>=0; });
    if(!found.length){ var p=document.createElement('p'); p.className='about'; p.textContent='No hay secciones con «'+inp.value+'». Prueba con otra palabra.'; list.appendChild(p); }
    found.forEach(function(s){
      var b = document.createElement('button'); b.innerHTML='<b></b><small></small>'; b.firstChild.textContent=s.t; b.lastChild.textContent=s.d;
      b.onclick = function(){ showSection(body, s.id, inp.value); };
      list.appendChild(b);
    });
  }
  inp.addEventListener('input', fill);
  body.appendChild(inp); body.appendChild(list); fill();
  $('#sheetBody').scrollTop = 0;
}
function showSection(body, id, q){
  var idx = 0; for(var i=0;i<MANUAL.length;i++) if(MANUAL[i].id===id) idx=i;
  var s = MANUAL[idx];
  body.innerHTML='';
  var bk = document.createElement('button'); bk.className='backbtn'; bk.textContent='Índice'; bk.onclick=function(){ showIndex(body, q||''); };
  body.appendChild(bk);
  var doc = document.createElement('div'); doc.className='mdoc';
  doc.innerHTML = '<h3></h3>' + s.h.replace('{{KEYS}}', keyTable());
  doc.querySelector('h3').textContent = s.t;
  body.appendChild(doc);
  if(s.ex && s.ex.length){
    var h = document.createElement('h4'); h.textContent='Pruébalo'; h.style.margin='4px 0'; body.appendChild(h);
    var tr = document.createElement('div'); tr.className='try';
    s.ex.forEach(function(x){
      var b = document.createElement('button'); b.innerHTML='Probar<span></span>'; b.lastChild.textContent = x.e;
      b.onclick = function(){ runExample(x); };
      tr.appendChild(b);
    });
    body.appendChild(tr);
  }
  var nav = document.createElement('div'); nav.className='mnav';
  if(idx>0){ var pv=document.createElement('button'); pv.textContent='← '+MANUAL[idx-1].t; pv.onclick=function(){ showSection(body, MANUAL[idx-1].id, q); }; nav.appendChild(pv); } else nav.appendChild(document.createElement('span'));
  if(idx<MANUAL.length-1){ var nx=document.createElement('button'); nx.textContent=MANUAL[idx+1].t+' →'; nx.onclick=function(){ showSection(body, MANUAL[idx+1].id, q); }; nav.appendChild(nx); }
  body.appendChild(nav);
  $('#sheetBody').scrollTop = 0;
}
function runExample(x){
  closeSheet();
  if(S.mode!==x.m) setMode(x.m);
  if(x.m==='graph'){
    var slot = -1; for(var i=0;i<S.funcs.length;i++){ if(!S.funcs[i].e.trim()){ slot=i; break; } }
    if(slot<0) slot = S.gsel;
    S.funcs[slot].e = x.e; S.funcs[slot].on = true; S.gsel = slot; marks=[];
    renderFuncs(); save(); drawGraph(); return;
  }
  var tex = mathjsTeX(x.e, x.m==='cas');
  exe(false, { latex: tex, lin: prep(x.e) });
}

/* ================= Arranque ================= */
function boot(){
  setupMathfield();
  replayCas(); applyTheme(); applyInputMode(); renderFuncs(); setMode(S.mode);
  $('#loading').remove();
  if(!isTouch){ if(S.input==='natural') mfFocus(); else expr.focus(); }
}
window.addEventListener('load', function(){
  if(window.customElements && customElements.whenDefined) customElements.whenDefined('math-field').then(boot); else boot();
});
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){ navigator.serviceWorker.register('sw.js'); }

/* Para pruebas automáticas */
window.__calcu = { latexToExpr: latexToExpr, evalCAS: evalCAS, S: S };
})();
</script>
